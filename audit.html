<!doctype html>
<html lang="en-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; frame-src 'self'; connect-src 'self'; media-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Math Quest — browser audit</title>
  <style>
    :root { color-scheme: light; font: 16px/1.45 system-ui, sans-serif; background: #eef7fb; color: #17324d; }
    body { max-width: 76rem; margin: 0 auto; padding: 1.25rem; }
    h1 { margin-bottom: .25rem; }
    .note { margin-top: 0; color: #405d73; }
    #summary { font-weight: 700; padding: .75rem 1rem; border-radius: .75rem; background: #fff; }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th, td { padding: .55rem; border: 1px solid #bfd3df; text-align: left; vertical-align: top; }
    .PASS { color: #12633a; font-weight: 700; }
    .FAIL { color: #9b2424; font-weight: 700; }
    iframe { width: 100%; min-height: 42rem; margin-top: 1rem; border: 2px solid #8eafc2; border-radius: .75rem; background: white; }
    details { margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>Browser audit</h1>
  <p class="note">This page tests the exact shipped game and curriculum manifest from the same local origin. It does not contact the internet.</p>
  <p id="summary" aria-live="polite">Running…</p>
  <table aria-label="Browser audit results">
    <thead><tr><th>ID</th><th>Result</th><th>Check</th><th>Details</th></tr></thead>
    <tbody id="results"></tbody>
  </table>
  <details><summary>Shipped game under test</summary><iframe id="game" title="Math Quest under browser audit"></iframe></details>
  <script src="audit/approved-visual-regression.js"></script>
  <script>
  (() => {
    "use strict";

    const TEST_SAVE_KEY = "math-quest:progress:v2";
    const TEST_PROGRESS_WRITE_LOCK = `${TEST_SAVE_KEY}:exclusive-progress-write`;
    const BETA1_SAVE_KEY = "math-quest:v2";
    const LEGACY_SAVE_KEY = "math-quest:v1";
    const TEST_CHILD_NAME_KEY = "math-quest:child-name:v1";
    const TEST_PLACEMENT_DRAFT_KEY = "math-quest:placement-draft:v1";
    const AUDIT_WATCHDOG_MS = 2_280_000;
    const requestedAuditShard = new URL(location.href).searchParams.get("audit-shard");
    const AUDIT_SHARD = ["core", "visual"].includes(requestedAuditShard) ? requestedAuditShard : "all";
    const TEST_CHILD_NAME_RECORD = JSON.stringify({
      schemaVersion: 1,
      savedAt: "2000-01-01T00:00:00.000Z",
      name: "Pip",
    });
    const results = [];
    let auditFinalized = false;
    let auditProgressMarker = "initializing";
    const resultBody = document.getElementById("results");
    const summary = document.getElementById("summary");
    const iframe = document.getElementById("game");
    const originalStorage = new Map([
      [TEST_SAVE_KEY, localStorage.getItem(TEST_SAVE_KEY)],
      [BETA1_SAVE_KEY, localStorage.getItem(BETA1_SAVE_KEY)],
      [LEGACY_SAVE_KEY, localStorage.getItem(LEGACY_SAVE_KEY)],
      [TEST_CHILD_NAME_KEY, localStorage.getItem(TEST_CHILD_NAME_KEY)],
      [TEST_PLACEMENT_DRAFT_KEY, localStorage.getItem(TEST_PLACEMENT_DRAFT_KEY)],
    ]);
    const restoreOriginalStorage = () => {
      for (const [key, value] of originalStorage) {
        if (value === null) localStorage.removeItem(key);
        else localStorage.setItem(key, value);
      }
    };
    window.addEventListener("pagehide", restoreOriginalStorage, { once: true });

    const add = (id, title, pass, details = "") => {
      if (auditFinalized) return;
      results.push({
        id,
        title,
        status: pass ? "PASS" : "FAIL",
        details: typeof details === "string" ? details : JSON.stringify(details),
      });
    };
    const normalized = (value) => String(value ?? "").normalize("NFC").trim();
    const pause = () => new Promise((resolve) => setTimeout(resolve, 0));
    const waitUntil = async (predicate, attempts = 150, intervalMs = 20) => {
      for (let index = 0; index < attempts; index += 1) {
        try {
          const value = await predicate();
          if (value) return value;
        } catch {}
        await new Promise((resolve) => setTimeout(resolve, intervalMs));
      }
      return null;
    };
    const childSetKeys = /^(?:ritualSetMembership|ritualSetMembers|allowedLiteralVocabulary|setMembership)$/u;
    const compareCodeUnits = (left, right) => String(left) < String(right) ? -1 : String(left) > String(right) ? 1 : 0;
    const normalizeChildValue = (value, key = "") => {
      if (typeof value === "string") return value.normalize("NFC").replace(/\r\n?/gu, "\n");
      if (Array.isArray(value)) {
        const list = value.map((entry) => normalizeChildValue(entry, key));
        return childSetKeys.test(key) ? list.sort(compareCodeUnits) : list;
      }
      if (value && typeof value === "object") {
        return Object.fromEntries(Object.keys(value).sort(compareCodeUnits).map((name) => [name, normalizeChildValue(value[name], name)]));
      }
      return value;
    };
    const jcsSerialize = (value) => {
      if (value === null) return "null";
      if (typeof value === "boolean") return value ? "true" : "false";
      if (typeof value === "number") {
        if (!Number.isFinite(value)) throw new TypeError("Child-string canonicalization rejects non-finite numbers.");
        return JSON.stringify(value);
      }
      if (typeof value === "string") return JSON.stringify(value);
      if (Array.isArray(value)) return `[${value.map(jcsSerialize).join(",")}]`;
      if (value && typeof value === "object") {
        return `{${Object.keys(value).sort(compareCodeUnits).map((key) => `${JSON.stringify(key)}:${jcsSerialize(value[key])}`).join(",")}}`;
      }
      throw new TypeError(`Child-string canonicalization cannot serialize ${typeof value}.`);
    };
    const canonicalChildStrings = (table) => {
      const records = (Array.isArray(table)
        ? table.map((record) => ({ ...record }))
        : Object.entries(table || {}).map(([id, record]) => ({ id, ...record })))
        .map((record) => normalizeChildValue(record))
        .sort((left, right) => compareCodeUnits(left.id, right.id));
      return jcsSerialize(records);
    };
    const halifaxPlayDay = () => {
      const parts = Object.fromEntries(new Intl.DateTimeFormat("en-CA", {
        timeZone: "America/Halifax",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
      }).formatToParts(new Date()).filter((part) => part.type !== "literal").map((part) => [part.type, Number(part.value)]));
      return Math.floor(Date.UTC(parts.year, parts.month - 1, parts.day) / 86400000);
    };
    const renderResults = () => {
      if (auditFinalized) return;
      auditFinalized = true;
      resultBody.replaceChildren(...results.map((item) => {
        const row = document.createElement("tr");
        for (const text of [item.id, item.status, item.title, item.details]) {
          const cell = document.createElement("td");
          cell.textContent = text;
          row.append(cell);
        }
        row.children[1].className = item.status;
        return row;
      }));
      const fail = results.filter((item) => item.status === "FAIL").length;
      summary.textContent = `${results.length - fail} passed; ${fail} failed.`;
      summary.className = fail ? "FAIL" : "PASS";
      const payload = { completed: true, generatedAt: new Date().toISOString(), shard: AUDIT_SHARD, results, fail, skipped: 0 };
      let node = document.getElementById("audit-json");
      if (!node) {
        node = document.createElement("script");
        node.id = "audit-json";
        node.type = "application/json";
        document.body.append(node);
      }
      node.textContent = JSON.stringify(payload).replace(/</gu, "\\u003c");
      document.documentElement.dataset.auditComplete = "true";
    };

    function armBrowserAuditWatchdog(openFrames) {
      return setTimeout(() => {
        if (auditFinalized) return;
        const activeFrames = [...document.querySelectorAll("iframe")].map((frame) => {
          const frameDocument = frame.contentDocument;
          const appRoot = frameDocument?.getElementById("app");
          return {
            title: frame.title || null,
            src: frame.getAttribute("src") || null,
            connected: frame.isConnected,
            documentReadyState: frameDocument?.readyState || null,
            appBusy: appRoot?.getAttribute("aria-busy") || null,
            appChildren: appRoot?.childElementCount ?? null,
          };
        });
        add("BR-00", "Browser harness completes", false, {
          reason: "The whole-run real-time watchdog expired before the audit completed.",
          watchdogMs: AUDIT_WATCHDOG_MS,
          completedResults: results.length,
          progressMarker: auditProgressMarker,
          activeFrames,
        });
        for (const frame of openFrames) frame.remove();
        iframe.src = "about:blank";
        restoreOriginalStorage();
        renderResults();
      }, AUDIT_WATCHDOG_MS);
    }

    const waitFrame = (frame, timeoutMs = 7000) => new Promise((resolve, reject) => {
      const timer = setTimeout(() => reject(new Error(`${frame.title || "frame"} did not load within ${timeoutMs} ms`)), timeoutMs);
      frame.addEventListener("load", () => { clearTimeout(timer); resolve(); }, { once: true });
      frame.addEventListener("error", () => { clearTimeout(timer); reject(new Error(`${frame.title || "frame"} failed to load`)); }, { once: true });
    });

    function baseUi(question, {
      screen = "session",
      phase = "question",
      candidates = [],
      choiceResolved = {},
      hintUsed = false,
      isReteach = false,
    } = {}) {
      return {
        version: 1,
        screen,
        phase,
        question,
        choiceCandidates: candidates,
        choiceResolved,
        selected: null,
        entry: "",
        fractionParts: { whole: "", numerator: "", denominator: "" },
        modelCells: [],
        modelTouched: false,
        hintUsed,
        selectionChanged: false,
        feedback: null,
        lastAttempt: null,
        replayMs: 0,
        manipulationMs: 0,
        maxIdleMs: 0,
        stopRequested: false,
        fatiguePending: false,
        reteachPending: null,
        reteachAdvancesIndex: false,
        isReteach,
        capstoneSubmitted: false,
      };
    }

    function questionArgs(skill, overrides = {}) {
      return {
        skillId: skill.skillId,
        tier: "HARD/TARGET",
        representation: skill.phases.includes("P") ? "PICTORIAL" : "ABSTRACT",
        seed: 1732050807,
        ordinal: 0,
        eligibleQuestionOrdinal: 0,
        scheduledReview: false,
        coldTest: false,
        preview: false,
        theme: "ocean",
        scaffolded: false,
        ...overrides,
      };
    }

    function findQuestion(engine, predicate, overrides = {}, minimumOrdinalCount = 3) {
      for (const skill of engine.SKILLS) {
        for (const tier of ["EASY", "HARD/TARGET"]) {
          const declaredTaskTypes = Array.isArray(skill.constraints?.taskTypes) ? skill.constraints.taskTypes : [];
          const ordinalCount = Math.max(minimumOrdinalCount, declaredTaskTypes.length);
          for (let ordinal = 0; ordinal < ordinalCount; ordinal += 1) {
            const question = engine.makeQuestion(questionArgs(skill, { tier, ordinal, eligibleQuestionOrdinal: ordinal, ...overrides }));
            if (predicate(question, skill)) return { question, skill, tier, ordinal };
          }
        }
      }
      throw new Error("The manifest/runtime does not provide the requested question capability.");
    }

    function activeStateFor(engine, playDay, question, {
      phase = "question",
      screen = "session",
      hintUsed = false,
      isReteach = false,
      previewLevel = null,
      stopReason = null,
      canonicalIndex = 1,
      reteachIndex = 0,
    } = {}) {
      const state = engine.createInitialState(playDay);
      if (previewLevel === null) state.earnedLevel = question.level;
      state.previewLevel = previewLevel;
      if (isReteach) state.reteachQueue = [{ skillId: question.skillId, reason: "SAME_SESSION" }];
      const built = engine.buildSessionQueue(state, { playDay, seed: state.seed });
      const skill = engine.SKILL_BY_ID[question.skillId];
      const availablePhases = skill.phases.filter((phase) => ["C", "P", "A"].includes(phase));
      const representationFor = (index) => ({
        C: "CONCRETE",
        P: "PICTORIAL",
        A: "ABSTRACT",
      })[availablePhases[Math.min(index, availablePhases.length - 1)]];
      const activeIndex = isReteach
        ? Math.max(0, Number(reteachIndex) || 0)
        : Math.max(0, Number(canonicalIndex) || 0);
      const effectivePracticeLimit = isReteach || screen === "capstone"
        ? Math.max(2, activeIndex + 1)
        : activeIndex + 1;
      const effectivePlannedCount = Math.min(
        engine.CONSTANTS.SESSION_PLANNED_BY_STAGE[question.stage],
        effectivePracticeLimit,
      );
      const choiceSet = new Set(engine.choicePositions({
        stage: question.stage,
        effectivePlannedCount,
      }));
      const queue = Array.from({ length: effectivePracticeLimit }, (_, index) => ({
        ordinal: index,
        baseOrdinal: index,
        skillId: question.skillId,
        tier: index % 3 === 2 ? "HARD/TARGET" : "EASY",
        representation: representationFor(index),
        scheduledReview: false,
        coldTest: false,
        choicePosition: choiceSet.has(index + 1),
        mandatorySecondExposure: false,
        obligation: previewLevel === null ? "NEW" : "PREVIEW",
        preview: previewLevel !== null,
      }));
      const choiceArgs = (slot) => ({
        ...slot,
        theme: question.theme,
        seed: question.seed,
        ordinal: slot.ordinal * 2,
        eligibleQuestionOrdinal: slot.baseOrdinal,
      });
      const choiceResolved = Object.fromEntries(queue
        .slice(0, isReteach ? activeIndex : activeIndex + 1)
        .flatMap((slot) => (
          slot.choicePosition && engine.makeQuestionChoices(choiceArgs(slot)).length === 2
            ? [[String(slot.ordinal), 0]]
            : []
        )));
      let activeQuestion = question;
      if (!isReteach && screen !== "capstone") {
        const slot = queue[activeIndex];
        const args = {
          ...slot,
          theme: question.theme,
          seed: question.seed,
          ordinal: slot.choicePosition ? slot.ordinal * 2 : slot.ordinal,
          eligibleQuestionOrdinal: slot.baseOrdinal,
        };
        if (slot.choicePosition) {
          const candidates = engine.makeQuestionChoices(args);
          const variant = Math.max(0, candidates.findIndex((candidate) => (
            candidate.inputMethod === question.inputMethod
            && candidate.taskType === question.taskType
          )));
          if (candidates.length === 2) choiceResolved[String(slot.ordinal)] = variant;
          activeQuestion = candidates[variant];
        } else {
          activeQuestion = engine.makeQuestion(args);
        }
      }
      const servedOrdinals = queue
        .slice(0, isReteach ? activeIndex : activeIndex + 1)
        .map((slot) => slot.ordinal);
      state.activeSession = {
        ...built,
        level: question.level,
        stage: question.stage,
        seed: question.seed,
        queue,
        baseSlotCount: queue.length,
        effectivePracticeLimit,
        effectivePlannedCount,
        effectiveTimeCapMs: 60_000,
        adultTimeReduced: true,
        index: activeIndex,
        world: question.theme,
        servedCount: servedOrdinals.length,
        servedOrdinals,
        elapsedMs: 100,
        stopReason,
        classifications: stopReason ? [stopReason] : [],
        oneMore: false,
        uiState: baseUi(activeQuestion, {
          phase,
          screen,
          hintUsed,
          isReteach,
          choiceResolved,
        }),
      };
      return state;
    }

    let primaryWriterLeaseReleased = false;
    function scenarioAppReady(frame) {
      const appRoot = frame.contentDocument?.getElementById("app");
      return Boolean(appRoot && appRoot.inert === false && appRoot.childElementCount > 0);
    }
    function scenarioFailClosedState(frame) {
      const frameDocument = frame.contentDocument;
      if (frameDocument?.querySelector("[data-progress-protection]")) return "progress-protection";
      if (frameDocument?.querySelector("[data-save-recovery]")) return "save-recovery";
      return null;
    }
    async function auditWriterLockSnapshot() {
      const locks = navigator.locks;
      if (!locks || typeof locks.query !== "function") {
        throw new Error("The browser audit requires Web Locks query support to prove writer isolation.");
      }
      const snapshot = await locks.query();
      const relevant = (records) => (Array.isArray(records) ? records : [])
        .filter((record) => record?.name === TEST_PROGRESS_WRITE_LOCK)
        .map((record) => ({ name: record.name, mode: record.mode || null }));
      return {
        held: relevant(snapshot?.held),
        pending: relevant(snapshot?.pending),
      };
    }
    async function requireAuditWriterIdle() {
      let consecutiveIdleObservations = 0;
      let lastSnapshot = { held: [], pending: [] };
      for (let attempt = 0; attempt < 100; attempt += 1) {
        lastSnapshot = await auditWriterLockSnapshot();
        const idle = lastSnapshot.held.length === 0 && lastSnapshot.pending.length === 0;
        consecutiveIdleObservations = idle ? consecutiveIdleObservations + 1 : 0;
        if (consecutiveIdleObservations >= 2) return lastSnapshot;
        await new Promise((resolve) => setTimeout(resolve, idle ? 0 : 20));
      }
      throw new Error(`The browser audit writer lease did not become idle: ${JSON.stringify(lastSnapshot)}`);
    }
    async function requireScenarioAppReady(
      frame,
      label = frame.title || "scenario",
      { allowFailClosedScreen = false } = {},
    ) {
      const ready = await waitUntil(() => scenarioAppReady(frame), 600, 20);
      if (!ready) {
        const frameDocument = frame.contentDocument;
        const appRoot = frameDocument?.getElementById("app");
        const diagnostic = {
          connected: frame.isConnected,
          documentReadyState: frameDocument?.readyState || null,
          documentUrl: frameDocument?.URL || null,
          appPresent: Boolean(appRoot),
          appInert: appRoot ? Boolean(appRoot.inert) : null,
          appBusy: appRoot?.getAttribute("aria-busy") || null,
          appChildren: appRoot?.childElementCount ?? null,
          progressProtection: Boolean(frameDocument?.querySelector('[data-action="progress-reload"]')),
        };
        throw new Error(`${label} did not render a usable app within 12000 ms: ${JSON.stringify(diagnostic)}`);
      }
      const failClosedState = scenarioFailClosedState(frame);
      if (failClosedState && !allowFailClosedScreen) {
        const lockSnapshot = await auditWriterLockSnapshot();
        const warning = normalized(
          frame.contentDocument?.querySelector(".runtime-warning,[role=alert]")?.textContent,
        );
        throw new Error(
          `${label} entered unexpected ${failClosedState}; `
          + `writer locks ${JSON.stringify(lockSnapshot)}; warning ${JSON.stringify(warning)}.`,
        );
      }
      return true;
    }
    async function requireScenarioHome(frame, label = frame.title || "scenario") {
      const ready = await waitUntil(() => Boolean(
        scenarioAppReady(frame)
        && frame.contentDocument?.querySelector('[data-action="start"]')
        && !frame.contentDocument?.querySelector('[data-action="name-skip"]')
      ), 600, 20);
      if (!ready) throw new Error(`${label} did not settle on Home within 12000 ms.`);
      return true;
    }
    function armAuditFrameRemoval(frame) {
      const nativeRemove = frame.remove.bind(frame);
      let pagehideSent = false;
      Object.defineProperty(frame, "remove", {
        configurable: true,
        value() {
          if (!pagehideSent) {
            pagehideSent = true;
            const frameWindow = frame.contentWindow;
            if (frameWindow) {
              frameWindow.dispatchEvent(new frameWindow.Event("pagehide"));
            }
          }
          return nativeRemove();
        },
      });
      return frame;
    }
    async function auditWriterBarrier() {
      if (!primaryWriterLeaseReleased) {
        await requireScenarioAppReady(iframe, "Primary audit frame");
        iframe.contentWindow?.dispatchEvent(new iframe.contentWindow.Event("pagehide"));
        primaryWriterLeaseReleased = true;
      }
      await navigator.locks.request(TEST_PROGRESS_WRITE_LOCK, { mode: "exclusive" }, () => true);
      await requireAuditWriterIdle();
    }

    async function scenarioFrameBytes(
      name,
      bytes,
      width = 1024,
      height = 900,
      { writerBarrier = true, allowFailClosedScreen = false } = {},
    ) {
      auditProgressMarker = `scenario:${name}:writer-barrier`;
      if (writerBarrier) await auditWriterBarrier();
      localStorage.setItem(TEST_SAVE_KEY, bytes);
      const frame = document.createElement("iframe");
      armAuditFrameRemoval(frame);
      frame.title = `Browser audit ${name}`;
      Object.assign(frame.style, {
        position: "fixed",
        left: "-20000px",
        top: "0",
        width: `${width}px`,
        height: `${height}px`,
        opacity: "0",
        pointerEvents: "none",
      });
      frame.src = `index.html?browser-audit=${encodeURIComponent(name)}-${Date.now()}-${Math.random()}`;
      document.body.append(frame);
      const scenario = {
        frame,
        get doc() { return frame.contentDocument; },
        get win() { return frame.contentWindow; },
      };
      keepAuditFramePainted(scenario);
      try {
        await waitFrame(frame);
        await pause();
        await requireScenarioAppReady(frame, frame.title, { allowFailClosedScreen });
        auditProgressMarker = `scenario:${name}:ready`;
        return scenario;
      } catch (error) {
        auditProgressMarker = `scenario:${name}:failed`;
        frame.remove();
        throw error;
      }
    }

    async function scenarioFrame(engine, name, state, width = 1024, height = 900) {
      return scenarioFrameBytes(name, engine.exportState(state), width, height);
    }

    async function reloadScenario(scenario, name) {
      const loaded = waitFrame(scenario.frame);
      scenario.frame.src = `index.html?browser-audit=${encodeURIComponent(name)}-${Date.now()}-${Math.random()}`;
      await loaded;
      await pause();
      await requireScenarioAppReady(scenario.frame);
      return scenario;
    }

    async function waitForScenarioNavigation(scenario, previousDocument, readyPredicate) {
      return waitUntil(() => (
        scenario.doc !== previousDocument
        && scenarioAppReady(scenario.frame)
        && readyPredicate(scenario)
      ), 350, 20);
    }

    function pwaPhysicalCacheNames(logicalIdentity, cacheNames) {
      if (
        logicalIdentity !== "math-quest-static-v1.0.0-beta.4"
        || !Array.isArray(cacheNames)
      ) return [];
      const prefix = `${logicalIdentity}-`;
      return cacheNames.filter((name) => (
        typeof name === "string"
        && name.startsWith(prefix)
        && /^[a-f0-9]{64}$/u.test(name.slice(prefix.length))
      ));
    }

    async function queryBrowserPwaReadiness(hostWindow, timeoutMs = 8000) {
      const serviceWorkers = hostWindow && "serviceWorker" in hostWindow.navigator
        ? hostWindow.navigator.serviceWorker
        : null;
      if (!serviceWorkers) return { registration: null, controller: null, readiness: null };
      const stageFailure = (stage, timedOut, cause = null) => {
        const label = {
          "service-worker-ready": "registration readiness",
          controllerchange: "controller readiness",
          "readiness-message": "readiness response",
        }[stage] || stage;
        const causeMessage = String(cause?.message || cause || "").trim();
        const failure = new Error(timedOut
          ? `service worker ${label} timed out after ${timeoutMs} ms${causeMessage ? `; cleanup failed: ${causeMessage}` : ""}`
          : `service worker ${label} failed${causeMessage ? `: ${causeMessage}` : ""}`);
        failure.code = timedOut
          ? "PWA_READINESS_STAGE_TIMEOUT"
          : "PWA_READINESS_STAGE_FAILED";
        failure.stage = stage;
        failure.timedOut = timedOut;
        failure.timeoutMs = timeoutMs;
        if (cause) failure.cause = cause;
        return failure;
      };
      const bounded = (promise, stage, cleanup = () => {}) => new Promise((resolve, reject) => {
        let settled = false;
        let timer = null;
        const finish = (kind, value, timedOut = false) => {
          if (settled) return;
          settled = true;
          let cleanupError = null;
          try {
            if (timer !== null) hostWindow.clearTimeout(timer);
          } catch (error) {
            cleanupError = error;
          }
          try {
            cleanup();
          } catch (error) {
            if (!cleanupError) cleanupError = error;
          }
          if (kind === "resolve" && !cleanupError) resolve(value);
          else reject(stageFailure(stage, timedOut, cleanupError || value));
        };
        timer = hostWindow.setTimeout(() => finish("reject", null, true), timeoutMs);
        Promise.resolve(promise).then(
          (value) => finish("resolve", value),
          (error) => finish("reject", error),
        );
      });
      const registration = await bounded(serviceWorkers.ready, "service-worker-ready");
      let removeControllerListener = () => {};
      const controller = serviceWorkers.controller || await bounded(new Promise((resolve) => {
        const onControllerChange = () => {
          const current = serviceWorkers.controller;
          if (!current) return;
          serviceWorkers.removeEventListener("controllerchange", onControllerChange);
          resolve(current);
        };
        removeControllerListener = () => serviceWorkers.removeEventListener("controllerchange", onControllerChange);
        serviceWorkers.addEventListener("controllerchange", onControllerChange);
        onControllerChange();
      }), "controllerchange", () => removeControllerListener());
      let closeReadinessPort = () => {};

    let shippedIndexSourcePromise;
    async function scenarioFrameAtClock(engine, name, state, nowMs, width = 1024, height = 900) {
      await auditWriterBarrier();
      localStorage.setItem(TEST_SAVE_KEY, engine.exportState(state));
      if (!shippedIndexSourcePromise) {
        shippedIndexSourcePromise = fetch("./index.html", { cache: "no-store" }).then(async (response) => {
          if (!response.ok) throw new Error(`Could not load the shipped game source: HTTP ${response.status}.`);
          return response.text();
        });
      }
      const source = await shippedIndexSourcePromise;
      const clockSource = `(() => {
        const NativeDate = Date;
        let controlledNow = ${Number(nowMs)};
        let controlledPerformanceNow = 1000;
        class AuditDate extends NativeDate {
          constructor(...args) { super(...(args.length ? args : [controlledNow])); }
          static now() { return controlledNow; }
        }
        Object.defineProperty(window, "Date", { configurable: true, value: AuditDate });
        Object.defineProperty(window.performance, "now", {
          configurable: true,
          value() { return controlledPerformanceNow; },
        });
        Object.defineProperty(window, "__setMathQuestAuditNow", {
          configurable: true,
          value(value) {
            const next = Number(value);
            controlledPerformanceNow += next - controlledNow;
            controlledNow = next;
          },
        });
      })();`;
      const clockPrelude = ["<", "script>", clockSource, "<", "/script>"].join("");
      const controlledSource = source.replace("</title>", `</title>${clockPrelude}`);
      if (controlledSource === source) throw new Error("Could not inject the controlled audit clock.");

      const frame = document.createElement("iframe");
      frame.title = `Browser audit ${name}`;
      Object.assign(frame.style, {
        position: "fixed",
        left: "-20000px",
        top: "0",
        width: `${width}px`,
        height: `${height}px`,
        opacity: "0",
        pointerEvents: "none",
      });
      const loaded = waitFrame(frame);
      frame.srcdoc = controlledSource;
      document.body.append(frame);
      await loaded;
      await pause();
      await requireScenarioAppReady(frame);
      return { frame, doc: frame.contentDocument, win: frame.contentWindow };
    }

    function dispatchKey(scenario, key, options = {}) {
      const target = scenario.doc.activeElement && scenario.doc.activeElement !== scenario.doc.documentElement
        ? scenario.doc.activeElement
        : scenario.doc.body;
      const event = new scenario.win.KeyboardEvent("keydown", {
        key,
        code: /^[0-9]$/u.test(key) ? `Digit${key}` : key === " " ? "Space" : key,
        shiftKey: Boolean(options.shiftKey),
        bubbles: true,
        cancelable: true,
        composed: true,
      });
      const notCanceled = target.dispatchEvent(event);
      return { target, notCanceled, defaultPrevented: event.defaultPrevented };
    }

      "EXPRESSION_BUILD", "PAIR_LINK", "SORT_BINS", "SHARE_DEAL", "GROUP_BUILD",

    async function activateResponse(scenario, selector, keyboard) {
      const control = scenario.doc.querySelector(selector);
      if (!control) {
        const renderedMethod = scenario.doc.querySelector("[data-input-method]")?.getAttribute("data-input-method") || "none";
        const renderedPhase = [...scenario.doc.querySelector(".question")?.classList || []]
          .find((name) => name.startsWith("phase-")) || "none";
        const renderedText = normalized(scenario.doc.body?.textContent).slice(0, 240);
        throw new Error(`Missing structured-response control ${selector}; rendered method ${renderedMethod}, phase ${renderedPhase}, text ${renderedText}.`);
      }
      if (keyboard) {
        control.focus();
        dispatchKey(scenario, "Enter");
        await pause();
        // Synthetic KeyboardEvent objects do not perform a browser's native
        // button activation. If the application did not consume the event and
        // rerender, use the native button click while preserving the keyboard
        // focus/name assertion exercised above.
        if (control.isConnected) control.click();

    const SORT_PROPERTY_TARGET = Object.freeze({
      "3 sides": "triangle",
      "4 equal sides": "square",
      "6 flat faces": "cube",
      "one curved surface and no flat faces": "sphere",
      "a right angle": "rectangle",
      "2 pairs of parallel sides and a right angle": "rectangle",
      "perpendicular sides and 2 long sides": "rectangle",
    });
    function sortItemMatchesRule(item, rule) {
      const attribute = String(rule?.attribute || "").trim().toLowerCase();
      const value = String(rule?.value || "").trim().toLowerCase();
      const shape = String(item?.shape || "").trim().toLowerCase();
      const solid = String(item?.solid || "").trim().toLowerCase();
      if (attribute === "shape") return shape === value;
      if (attribute === "solid") return solid === value;
      if (attribute === "property") {
        const target = SORT_PROPERTY_TARGET[value];
        return Boolean(target) && (shape === target || solid === target);
      }
      return false;
    }
    function sortItemAttributeValue(item, attribute) {
      const key = String(attribute || "").trim().toLowerCase();
      if (key === "colour" || key === "color") {
        return String(item?.colour ?? item?.color ?? "").trim().toLowerCase();
      }
      if (key === "shape") return String(item?.shape ?? "").trim().toLowerCase().replace(/s$/u, "");
      if (key === "size") return String(item?.size ?? "").trim().toLowerCase();
      if (key === "solid") return String(item?.solid ?? "").trim().toLowerCase();
      return String(item?.[key] ?? item?.value ?? "").trim().toLowerCase();
    }
    function categoricalSortBinId(item, values) {
      const categories = Array.isArray(values?.categories) ? values.categories : [];
      const ids = categories.map((category) => String(category?.id ?? ""));
      if (categories.length < 2 || categories.length > 3 || new Set(ids).size !== categories.length
        || ids.some((id) => !id)) {
        throw new Error("Categorical SORT_BINS descriptor has invalid or duplicate category IDs.");
      }
      const itemValue = sortItemAttributeValue(item, values?.rule?.attribute);
      const matching = categories.filter((category) => (
        String(category?.value ?? "").trim().toLowerCase().replace(
          values?.rule?.attribute === "shape" ? /s$/u : /$^/u,
          "",
        ) === itemValue
      ));
      if (matching.length !== 1) {
        throw new Error(`Categorical SORT_BINS item maps to ${matching.length} bins instead of exactly one.`);
      }
      return String(matching[0].id);
    }

    async function answerStructured(scenario, question, { keyboard = false } = {}) {
      const params = question.params || {};
      if (question.inputMethod === "PAIR_LINK") {
        const pairs = Math.min(Number(params.leftCount ?? params.count), Number(params.rightCount ?? params.count));
        for (let index = 0; index < pairs; index += 1) {
          await activateResponse(scenario, `[data-response-action="pair-item"][data-item-id="a${index}"]`, keyboard);
          await activateResponse(scenario, `[data-response-action="pair-item"][data-item-id="b${index}"]`, keyboard);
        }
      } else if (question.inputMethod === "SORT_BINS") {
        const values = question.modelDescriptor?.values || {};
        const rule = values.rule || {};
        const items = values.items || [];
        const categorical = Array.isArray(values.categories) && values.categories.length > 0;
        for (let index = 0; index < items.length; index += 1) {
          await activateResponse(scenario, `[data-response-action="sort-item"][data-item-id="i${index}"]`, keyboard);
          const bin = categorical
            ? categoricalSortBinId(items[index], values)
            : sortItemMatchesRule(items[index], rule) ? "matches" : "other";
          await activateResponse(scenario, `[data-response-action="sort-bin"][data-bin-id="${bin}"]`, keyboard);
        }
      } else if (question.inputMethod === "COUNT_TOUCH") {
        for (let index = 0; index < Number(question.answer.value); index += 1) {
          await activateResponse(scenario, `[data-response-action="count-touch"][data-item-id="i${index}"]`, keyboard);
        }
        await activateResponse(
          scenario,
          `[data-response-action="count-number"][data-count-value="${CSS.escape(String(question.answer.value))}"]`,
          keyboard,
        );
      } else if (question.inputMethod === "ORDER_BUILD") {
        for (const value of [params.before, question.answer.value, params.after]) {
          await activateResponse(scenario, `[data-response-action="order-card"][data-value="${CSS.escape(String(value))}"]`, keyboard);
        }
      } else if (question.inputMethod === "GRID_ROUTE") {
        const specification = scenario.win.MathQuestEngine.gridRouteSpecification(question);
        if (!specification) throw new Error("GRID_ROUTE has no valid route specification.");
        for (const move of specification.expectedMoves) {
          await activateResponse(scenario, `[data-response-action="route-move"][data-move="${move}"]`, keyboard);
        }
      } else if (question.inputMethod === "METRIC_SCALE") {
        await activateResponse(
          scenario,
          `[data-response-action="scale-mark"][data-value="${CSS.escape(String(question.answer.value))}"]`,
          keyboard,
        );
      } else if (question.inputMethod === "VOLUME_INSPECT") {
        for (let layer = 1; layer <= Number(params.height); layer += 1) {
          await activateResponse(scenario, `[data-response-action="volume-layer"][data-layer="${layer}"]`, keyboard);
        }
        await activateResponse(scenario, '[data-response-action="volume-method"][data-value="multiply"]', keyboard);
        const input = scenario.doc.querySelector('[data-response-input="value"]');
        if (!input) throw new Error("VOLUME_INSPECT did not reveal volume entry after every layer and a valid method.");
        input.value = String(question.answer.value);
        input.dispatchEvent(new scenario.win.Event("input", { bubbles: true }));
        await pause();
      } else {
        throw new Error(`Browser scenario has no UI driver for structured method ${question.inputMethod}.`);
      }
      const confirm = scenario.doc.querySelector('[data-action="confirm"]:not([disabled])');
      if (!confirm) throw new Error(`${question.inputMethod} did not enable Confirm after a complete response.`);
      if (keyboard) {
        confirm.focus();
        dispatchKey(scenario, "Enter");
        if (confirm.isConnected) confirm.click();
      } else confirm.click();
      await pause();
    }

    async function answerCorrect(scenario, question, { keyboard = false } = {}) {
      if (question.inputClass === "SELECTION") {
        if (keyboard) {
          dispatchKey(scenario, String(question.correctIndex + 1));
          await pause();
          const confirm = scenario.doc.querySelector('[data-action="confirm"]:not([disabled])');
          if (!confirm) throw new Error("Keyboard choice did not enable the separate Confirm button.");
          confirm.focus();
          dispatchKey(scenario, "Enter");
          if (confirm.isConnected) confirm.click();
        } else {
          scenario.doc.querySelector(`[data-action="select"][data-id="${CSS.escape(question.options[question.correctIndex].optionId)}"]`)?.click();
          await pause();
          scenario.doc.querySelector('[data-action="confirm"]:not([disabled])')?.click();
        }
        await pause();
        return;
      }
      if (STRUCTURED_RESPONSE_METHODS.has(question.inputMethod)) {
        await answerStructured(scenario, question, { keyboard });
        return;
      }
      const answer = String(question.answer.value);
      if (question.inputMethod === "FRACTION_ENTRY" || question.inputMethod === "MIXED_NUMBER_ENTRY") {
        const match = answer.match(/^(?:(-?\d+)\s+)?(-?\d+)\/(\d+)$/u);
        if (!match) throw new Error(`Cannot enter fraction audit answer ${answer}.`);
        const values = { whole: match[1] || "", numerator: match[2], denominator: match[3] };
        for (const [part, value] of Object.entries(values)) {
          const input = scenario.doc.querySelector(`[data-control-part="${part}"]`);
          if (!input) continue;
          input.value = value;
          input.dispatchEvent(new scenario.win.Event("input", { bubbles: true }));
          await pause();
        }
        scenario.doc.querySelector('[data-action="confirm"]:not([disabled])')?.click();
        await pause();
        return;
      }
      if (keyboard && /^[0-9.-]+$/u.test(answer)) {
        for (const char of answer) {
          dispatchKey(scenario, char);
          await pause();
        }
        dispatchKey(scenario, "Enter");
        await pause();
        return;
      }
      const controls = scenario.doc.querySelector(".answer-controls");
      for (const char of answer) {
        controls?.querySelector(`[data-action="key"][data-key="${CSS.escape(char)}"]`)?.click();
        await pause();
      }
      scenario.doc.querySelector('[data-action="confirm"]:not([disabled])')?.click();
      await pause();
    }

    function placementTraversalMatrix(engine, state) {
      const answerHelper = window.MathQuestApprovedVisualRegression?.correctAnswer;
      if (typeof answerHelper !== "function") throw new Error("Placement audit answer helper is unavailable.");
      if (typeof engine.submitPlacementNotSure !== "function") throw new Error("Placement not-sure API is unavailable.");
      const methods = new Map();
      const methodCases = new Map();
      const rows = [];
      let selectionCase = null;
      let appliedCase = null;
      for (let desiredLevel = engine.CONSTANTS.LEVEL_MIN; desiredLevel <= engine.CONSTANTS.LEVEL_MAX; desiredLevel += 1) {
        let run = engine.createPlacementRun({
          state,
          playDay: state.maxSeenPlayDay,
          seed: state.seed,
          theme: "ocean",
        });
        for (let index = 0; index < engine.CONSTANTS.PLACEMENT_MAX_QUESTIONS; index += 1) {
          const validation = engine.validatePlacementRun(run, state);
          if (!validation.valid) throw new Error(validation.error);
          if (validation.complete) break;
          const question = engine.placementCurrentQuestion(run);
          if (!methods.has(question.inputMethod)) {
            methods.set(question.inputMethod, {
              inputClass: question.inputClass,
              skillId: question.skillId,
              level: question.level,
              questionId: question.questionId,
            });
            methodCases.set(question.inputMethod, { run, question, desiredLevel });
          }
          if (!selectionCase && question.inputClass === "SELECTION") {
            selectionCase = { run, question, desiredLevel };
          }
          const correct = question.level < desiredLevel;
          const submitted = correct
            ? engine.submitPlacementAnswer(run, answerHelper(engine, question))
            : engine.submitPlacementNotSure(run);
          run = submitted.run;
        }
        const validation = engine.validatePlacementRun(run, state);
        const recommendation = engine.placementRecommendation(run);
        rows.push({
          desiredLevel,
          questionCount: run.answers.length,
          complete: validation.valid && validation.complete,
          recommendedLevel: recommendation?.recommendedLevel ?? null,
          pass: Boolean(
            validation.valid
            && validation.complete
            && run.answers.length >= engine.CONSTANTS.PLACEMENT_MIN_QUESTIONS
            && run.answers.length <= engine.CONSTANTS.PLACEMENT_MAX_QUESTIONS
            && recommendation?.recommendedLevel === desiredLevel
          ),
        });
        if (desiredLevel === Math.min(9, engine.CONSTANTS.LEVEL_MAX)) {
          appliedCase = { run, recommendation };
        }
      }
      return {
        rows,
        methods: [...methods.entries()].sort(([left], [right]) => left.localeCompare(right))
          .map(([inputMethod, witness]) => ({ inputMethod, ...witness })),
        methodCases: [...methodCases.entries()].sort(([left], [right]) => left.localeCompare(right))
          .map(([inputMethod, witness]) => ({ inputMethod, ...witness })),
        selectionCase,
        appliedCase,
      };
    }

    function visibleMetrics(scenario, scopeSelector = "body") {
      const scope = scenario.doc.querySelector(scopeSelector);
      if (!scope) return { minFont: 0, minControl: 0, inter: false };
      const visible = (element) => {
        const style = scenario.win.getComputedStyle(element);
        const rect = element.getBoundingClientRect();
        return style.display !== "none" && style.visibility !== "hidden" && rect.width > 0 && rect.height > 0;
      };
      const text = [...scope.querySelectorAll("h1,h2,h3,p,label,button,input,select,output,.prompt,.small")].filter(visible);
      const controls = [...scope.querySelectorAll("button,input,select")].filter(visible);
      return {
        minFont: text.length ? Math.min(...text.map((element) => Number.parseFloat(scenario.win.getComputedStyle(element).fontSize))) : 0,
        minControl: controls.length ? Math.min(...controls.map((element) => {
          const rect = element.getBoundingClientRect();
          return Math.min(rect.width, rect.height);
        })) : 0,
        inter: text.length > 0 && text.every((element) => /Inter/iu.test(scenario.win.getComputedStyle(element).fontFamily)),
      };
    }
    function renderedElement(scenario, element) {
      if (!element) return false;
      const style = scenario.win.getComputedStyle(element);
      const rect = element.getBoundingClientRect();
      return style.display !== "none" && style.visibility !== "hidden"
        && Number(style.opacity) !== 0 && rect.width > 0 && rect.height > 0;
    }
    function rectContains(outer, inner, tolerance = 1) {
      return Boolean(outer && inner
        && inner.left >= outer.left - tolerance
        && inner.top >= outer.top - tolerance
        && inner.right <= outer.right + tolerance
        && inner.bottom <= outer.bottom + tolerance);
    }
    function rectsOverlap(left, right, tolerance = 0.5) {
      return left.left < right.right - tolerance
        && left.right > right.left + tolerance
        && left.top < right.bottom - tolerance
        && left.bottom > right.top + tolerance;
    }
    function actionVisibleInViewport(scenario, element) {
      if (!renderedElement(scenario, element)) return false;
      const rect = element.getBoundingClientRect();
      return rect.left >= -1 && rect.top >= -1
        && rect.right <= scenario.win.innerWidth + 1
        && rect.bottom <= scenario.win.innerHeight + 1;
    }
    function responseBeforeConfirm(scenario) {
      const response = scenario.doc.querySelector(".question-response");
      const confirm = response?.querySelector(".question-submit [data-action=\"confirm\"]");
      if (!response || !confirm) return { pass: false, reason: "missing response or Confirm" };
      const controls = [...response.querySelectorAll("button,input,select,textarea")]
        .filter((control) => control !== confirm);
      const allBefore = controls.length > 0 && controls.every((control) => (
        Boolean(control.compareDocumentPosition(confirm) & scenario.win.Node.DOCUMENT_POSITION_FOLLOWING)
      ));
      const submitIsLast = response.lastElementChild?.classList.contains("question-submit");
      const answerControls = response.querySelector(".answer-controls");
      const submit = response.querySelector(".question-submit");
      const answerRect = answerControls?.getBoundingClientRect();
      const submitRect = submit?.getBoundingClientRect();
      const geometricallyBefore = Boolean(answerRect && submitRect && answerRect.bottom <= submitRect.top + 1);
      return {
        pass: allBefore && submitIsLast && geometricallyBefore,
        controls: controls.length,
        allBefore,
        submitIsLast,
        geometricallyBefore,
      };
    }
    function naturalQuestionFlow(scenario) {
      const support = scenario.doc.querySelector(".support-scroll");
      const feedback = scenario.doc.querySelector(".feedback-flow");
      const question = scenario.doc.querySelector(".question");
      const flow = feedback || support;
      if (!flow || !question) return { pass: false, reason: "missing question or feedback flow" };
      const offenders = [question, ...question.querySelectorAll("*")]
        .filter((element) => renderedElement(scenario, element))
        .map((element) => {
          const style = scenario.win.getComputedStyle(element);
          const excess = element.scrollHeight - element.clientHeight;
          const overflowY = style.overflowY;
          const hasNestedVerticalScroll = excess > 1 && ["auto", "scroll"].includes(overflowY);
          const clipsVerticalContent = excess > 1 && ["hidden", "clip"].includes(overflowY);
          if (!hasNestedVerticalScroll && !clipsVerticalContent) return null;
          const classes = [...element.classList].slice(0, 3).join(".");
          return {
            element: `${element.localName}${element.id ? `#${element.id}` : ""}${classes ? `.${classes}` : ""}`,
            overflowY,
            scrollHeight: element.scrollHeight,
            clientHeight: element.clientHeight,
            hasNestedVerticalScroll,
            clipsVerticalContent,
          };
        })
        .filter(Boolean);
      const questionStyle = scenario.win.getComputedStyle(question);
      const flowStyle = scenario.win.getComputedStyle(flow);
      return {
        pass: offenders.length === 0,
        kind: feedback ? "feedback" : "active-question",
        inspected: 1 + question.querySelectorAll("*").length,
        offenders,
        flowOverflowY: flowStyle.overflowY,
        flowScrollHeight: flow.scrollHeight,
        flowClientHeight: flow.clientHeight,
        questionOverflowY: questionStyle.overflowY,
        questionScrollHeight: question.scrollHeight,
        questionClientHeight: question.clientHeight,
      };
    }

    function installDeterministicFrameClock(scenario) {

        Object.defineProperty(scenario.win, "requestAnimationFrame", {
          configurable: true,
          value(callback) {
            const id = ++sequence;

              if (!cancelled.has(id)) callback(scenario.win.performance.now());
              cancelled.delete(id);

        if (AUDIT_SHARD !== "core") {
          await auditWriterBarrier();
          auditProgressMarker = "approved-visual-regression:starting";
          const visualRegression = window.MathQuestApprovedVisualRegression;
          if (!visualRegression || typeof visualRegression.run !== "function") throw new Error("Manifest visual regression helper did not load.");
          const visual = await visualRegression.run({
            engine,
            hostWindow: win,
            hostDocument: document,
            storageKey,
            childNameKey: TEST_CHILD_NAME_KEY,
            placementDraftKey: TEST_PLACEMENT_DRAFT_KEY,
            pause,
            activeStateFactory: activeStateFor,
          });
          for (const [id, title] of Object.entries(visual.titles)) {
            const check = visual.tests[id];
            add(id, title, Boolean(check?.pass), check?.details || "No result returned.");
          }
        }
        auditProgressMarker = "complete";
      } catch (error) {
        add("BR-00", "Browser harness completes", false, String(error?.stack || error?.message || error));
      } finally {
        clearTimeout(auditWatchdog);
        for (const frame of openFrames) frame.remove();
        iframe.src = "about:blank";
        restoreOriginalStorage();
        renderResults();
      }
    })();
  })();
  </script>
</body>
