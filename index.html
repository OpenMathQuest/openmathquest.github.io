    function voiceTab(voices){return `<h2>Feedback voices</h2><p>Choose a local installed voice for each feedback class.</p>${E.CONSTANTS.FEEDBACK_CLASSES.map(c=>`<div class="field"><label>${c}</label><select data-feedback-voice="${c}"><option value="">Use main voice</option>${voices.map(v=>`<option value="${escape(v.voiceURI)}" ${state.settings.feedbackVoiceByClass[c]===v.voiceURI?'selected':''}>${escape(v.name)}</option>`).join("")}</select></div>`).join("")}`;}
    function stringReviewTab(){const pending=E.CONSTANTS.CHILD_STRINGS_PENDING_APPROVAL,groups=Object.groupBy?Object.groupBy(E.CHILD_STRINGS,row=>row.category):E.CHILD_STRINGS.reduce((all,row)=>((all[row.category]??=[]).push(row),all),{});const notice=pending?`<div class="notice"><strong>Pending project-owner approval.</strong> Shipping stays blocked until the exact table is reviewed and its candidate digest is recorded.</div>`:`<div class="notice"><strong>Approved and locked.</strong> The project owner approved all ${E.CHILD_STRINGS.length} exact records. They are canonicalized as <code>child-strings-v1</code> and protected by SHA-256 <code>${escape(E.CONSTANTS.CHILD_STRING_APPROVAL_SHA256)}</code>.</div>`;return `<h2>Child wording review</h2>${notice}${Object.entries(groups).map(([category,rows])=>`<h3>${escape(category)}</h3><div class="scroll"><table class="skill-table"><thead><tr><th>ID</th><th>Exact text or template</th><th>Allowed slots</th></tr></thead><tbody>${rows.map(row=>`<tr><td>${escape(row.id)}</td><td>${escape(row.text)}</td><td>${escape(JSON.stringify(row.slotDefinitions))}</td></tr>`).join("")}</tbody></table></div>`).join("")}`;}
    function parents(){app.innerHTML=`<div class="shell">${header()}<section class="panel"><h2>Note for parents</h2><p>This build follows the independently authored Math Quest curriculum manifest and moves from Concrete to Pictorial to Abstract teaching. Physical objects stay important even when the screen shows a model.</p><p>There are no points, prizes, stars, badges, or child-facing promotion messages. Progress is visible to grown-ups as evidence by skill and tier.</p><div class="notice"><strong>${E.CONSTANTS.CHILD_STRINGS_PENDING_APPROVAL?"Child wording pending re-approval.":"Child wording approved."}</strong> ${E.CONSTANTS.CHILD_STRINGS_PENDING_APPROVAL?"The project owner must approve the exact child-facing table before release.":"The exact child-facing records are locked as <code>child-strings-v1</code> and verified by the shipped approval digest."}</div><nav class="legal-links" aria-label="Privacy, licences, and attributions"><a href="./PRIVACY.md" target="_blank" rel="noopener">Privacy</a><a href="./THIRD_PARTY_NOTICES.md" target="_blank" rel="noopener">Licences and attributions</a><a href="./LICENSE" target="_blank" rel="noopener">MIT licence</a></nav><button class="primary" data-action="home">Back</button></section></div>`;app.focus();}
    function render(){if(ui.screen==="nameGate")nameGateView();else if(ui.screen==="home")home();else if(ui.screen==="session")sessionView();else if(ui.screen==="fatigue")fatigueView();else if(ui.screen==="capstone")capstoneView();else if(ui.screen==="done")doneView();else if(ui.screen==="grown")grown();else if(ui.screen==="lab")parentLabViewV2();else parents();}
    function chooseVariant(index){const slot=ui.session.queue[ui.index],variant=Math.max(0,Math.min(1,Number(index)||0));ui.choiceResolved[slot.ordinal]=variant;activateQuestion(ui.choiceCandidates[variant],slot);}
    function selectOption(optionId){const at=now(),previous=ui.selected;noteActivity(at);playSound("tap");if(ui.selectionRestored&&previous!==null&&previous!==optionId)ui.selectionEvents=[{optionId:previous,at:0},{optionId,at:E.CONSTANTS.SELECTION_DEBOUNCE_MS}];else ui.selectionEvents.push({optionId,at});ui.selectionRestored=false;ui.selected=optionId;const label=ui.question.options.find(option=>option.optionId===ui.selected)?.label||"";save();render();const selected=[...app.querySelectorAll('[data-action="select"]')].find(control=>control.dataset.id===ui.selected);if(selected)selected.focus();announce(s("announcement.selected",{label}));}
    function clearLabFeedback(){lab.result="";lab.showExpected=false;}
    function applyLabKey(key){if(key==="Clear")lab.entry="";else if(key==="⌫")lab.entry=lab.entry.slice(0,-1);else if(key==="−")lab.entry=lab.entry.startsWith("-")?lab.entry.slice(1):"-"+lab.entry;else lab.entry+=key;lab.modelTouched=true;clearLabFeedback();}
    app.addEventListener("click",event=>{
      const control=event.target.closest("[data-lab-action]");if(!control)return;const action=control.dataset.labAction;
      if(action==="enter"){enterLab();return;}if(!lab||ui.screen!=="lab")return;
      if(action==="exit"){labStorageIntact();lab=null;ui.screen="grown";render();return;}
      if(action==="previous"){lab.sampleOrdinal=Math.max(0,lab.sampleOrdinal-1);clearLabAnswer();renderLabAndFocus('[data-lab-action="previous"]');}
      else if(action==="next"){lab.sampleOrdinal+=1;clearLabAnswer();renderLabAndFocus('[data-lab-action="next"]');}
      else if(action==="select"){const q=labQuestionAt();if(q.options.some(option=>option.optionId===control.dataset.optionId)){lab.selected=control.dataset.optionId;clearLabFeedback();renderLabAndFocus(`[data-option-id="${CSS.escape(lab.selected)}"]`);}}
      else if(action==="model-cell"){const index=Number(control.dataset.cell);if(Number.isInteger(index)&&index>=0&&index<lab.modelCells.length){lab.modelCells[index]=!lab.modelCells[index];lab.entry=String(lab.modelCells.filter(Boolean).length||"");lab.modelTouched=true;clearLabFeedback();renderLabAndFocus(`[data-lab-action="model-cell"][data-cell="${index}"]`);}}
      else if(action==="line-mark"){lab.entry=String(control.dataset.value);lab.modelTouched=true;clearLabFeedback();renderLabAndFocus(`[data-lab-action="line-mark"][data-value="${CSS.escape(lab.entry)}"]`);}
      else if(action==="bar-part"){lab.modelTouched=true;clearLabFeedback();labStorageIntact();announce(s("announcement.barPart"));}
      else if(action==="key"){const key=control.dataset.key;applyLabKey(key);renderLabAndFocus(`[data-lab-action="key"][data-key="${CSS.escape(key)}"]`);}
      else if(action==="grade")gradeLabAnswer();
      else if(action==="model"){lab.showModel=!lab.showModel;labStorageIntact();renderLabAndFocus('[data-lab-action="model"]');}
      else if(action==="expected"){lab.showExpected=!lab.showExpected;labStorageIntact();renderLabAndFocus('[data-lab-action="expected"]');}
    });
    app.addEventListener("change",event=>{const el=event.target;if(!lab||ui.screen!=="lab")return;if(el.matches("[data-lab-level]")){const level=Number(el.value),first=labSkills(level)[0];if(LEVEL_BY_NUMBER[level]&&first){lab.level=level;lab.skillId=first.skillId;lab.sampleOrdinal=0;clearLabAnswer();renderLabAndFocus("[data-lab-level]");}}else if(el.matches("[data-lab-skill]")){if(labSkills(lab.level).some(skill=>skill.skillId===el.value)){lab.skillId=el.value;lab.sampleOrdinal=0;clearLabAnswer();renderLabAndFocus("[data-lab-skill]");}}else if(el.matches("[data-lab-tier]")){if(["EASY","HARD/TARGET"].includes(el.value)){lab.tier=el.value;lab.sampleOrdinal=0;clearLabAnswer();renderLabAndFocus("[data-lab-tier]");}}});
    app.addEventListener("input",event=>{const el=event.target,part=el.dataset.fractionPart;if(!part)return;const mode=el.dataset.controlMode==="lab"?"lab":"play",controls=controlState(mode);if(mode==="lab"&&(!lab||ui.screen!=="lab"))return;controls.fractionParts[part]=el.value.replace(/[^0-9-]/g,"");const {whole,numerator,denominator}=controls.fractionParts;controls.entry=numerator&&denominator?(whole?whole+" ":"")+numerator+"/"+denominator:"";controls.modelTouched=true;const wrapper=el.closest(".answer-controls"),box=wrapper?.querySelector("[data-answerbox]"),confirm=mode==="lab"?wrapper?.querySelector('[data-lab-action="grade"]'):app.querySelector('[data-action="confirm"]');if(box)box.textContent=controls.entry||" ";if(confirm)confirm.disabled=!controls.entry.trim();if(mode==="lab"){clearLabFeedback();labStorageIntact();const result=app.querySelector("[data-lab-result]"),expected=app.querySelector("[data-lab-expected]");if(result)result.textContent="";if(expected)expected.hidden=true;}else{beginManipulation();save();}});
    app.addEventListener("click",event=>{const action=event.target.closest("[data-action]")?.dataset.action;if(["model-cell","line-mark","bar-part","key"].includes(action))beginManipulation();else if(["world","select","choose-question","confirm","next","physical-done","start","grown","parents","one-more","done-now","finish","hint"].includes(action))playSound("tap");else if(action==="replay")pauseManipulation();},true);
    app.addEventListener("click",event=>{
      const b=event.target.closest("[data-action]");if(!b)return;const action=b.dataset.action;
      if(action==="home"){ui.screen=profileChosen?"home":"nameGate";state.previewLevel=null;save();render();}
      else if(action==="world"){ui.world=b.dataset.world;render();}
      else if(action==="start"){if(!resumeActive())startSession();}
      else if(action==="grown"){ui.screen="grown";render();}
      else if(action==="parents"){ui.screen="parents";render();}
      else if(action==="choose-question")chooseVariant(b.dataset.variant);
      else if(action==="physical-done"){ui.modelTouched=true;ui.phase="question";save();render();speak(ui.question.prompt,()=>{ui.promptFinishedAt=now();ui.idleStart=now();});}
      else if(action==="select")selectOption(b.dataset.id);
      else if(action==="model-cell"){const index=Number(b.dataset.cell);ui.modelCells[index]=!ui.modelCells[index];ui.entry=String(ui.modelCells.filter(Boolean).length||"");ui.modelTouched=true;save();render();}
      else if(action==="line-mark"){ui.entry=String(b.dataset.value);ui.modelTouched=true;save();render();}
      else if(action==="bar-part"){ui.modelTouched=true;save();announce(s("announcement.barPart"));}
      else if(action==="key"){const k=b.dataset.key;if(k==="Clear")ui.entry="";else if(k==="⌫")ui.entry=ui.entry.slice(0,-1);else if(k==="−")ui.entry=ui.entry.startsWith("-")?ui.entry.slice(1):"-"+ui.entry;else ui.entry+=k;ui.modelTouched=true;save();render();}
      else if(action==="confirm")submit();
      else if(action==="next")next();
      else if(action==="hint"){noteActivity();ui.hintUsed=true;ui.modelTouched=true;save();render();speak(ui.question.modelDescriptor.instruction);announce(s("announcement.modelReady"));}
      else if(action==="replay"){const started=now();noteActivity(started);speak(ui.question.prompt,()=>{const ended=now();ui.replayMs+=ended-started;ui.idleStart=ended;save();});}
      else if(action==="stop"){if(ui.isReteach){ui.stopReason="ADULT_STOPPED";ui.stopRequested=true;addClassification("ADULT_STOPPED");save();render();}else stopSession("ADULT_STOPPED");}
      else if(action==="one-more"){ui.stopReason="FATIGUE_STOPPED";ui.stopRequested=true;ui.oneMore=true;addClassification("FATIGUE_STOPPED");ui.screen="session";ui.index+=1;if(ui.index>=ui.session.queue.length)capstone();else prepareQuestion();}
      else if(action==="done-now"){ui.stopReason="FATIGUE_STOPPED";ui.stopRequested=true;addClassification("FATIGUE_STOPPED");capstone();}
      else if(action==="finish")finish();
      else if(action==="grown-tab"){ui.grownTab=b.dataset.tab;render();}
      else if(action==="preview"){const level=Number(b.dataset.level);if(LEVEL_BY_NUMBER[level]){state.previewLevel=level;save();render();}}
      else if(action==="leave-preview"){state.previewLevel=null;save();render();}
      else if(action==="test-voice")speak(s("adult.voiceTest"));
      else if(action==="test-sound"){const prev=state.settings.soundEnabled;state.settings.soundEnabled=true;playSound("confirm");state.settings.soundEnabled=prev;}
      else if(action==="name-edit"){ui.screen="nameGate";ui.nameGateInput=childName||"";ui.nameGateError="";ui.removeNameArmed=false;render();}
      else if(action==="name-skip"){const persisted=persistAnonymousChoice();if(!persisted){render();return;}childNameRecord=loadChildNameRecord();childName=null;profileChosen=true;ui.nameGateError="";ui.nameGateInput="";ui.screen="home";render();}
      else if(action==="name-remove"){if(!ui.removeNameArmed){ui.removeNameArmed=true;render();}else{const removed=persistAnonymousChoice();if(!removed){ui.removeNameArmed=false;render();return;}childNameRecord=loadChildNameRecord();childName=null;profileChosen=true;ui.removeNameArmed=false;ui.nameGateInput="";ui.nameGateError="";ui.screen="grown";render();}}
      else if(action==="export"){const blob=new Blob([E.exportState(state)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="math-quest-backup.json";a.click();URL.revokeObjectURL(url);}
      else if(action==="import-trigger")document.getElementById("importFile")?.click();
      else if(action==="reset"){if(!ui.resetArmed){ui.resetArmed=true;render();}else{state=E.createInitialState(dayNow());ui={...ui,screen:"home",session:null,index:0,resetArmed:false,stopReason:null,stopRequested:false};localStorage.setItem(KEY,E.exportState(state));render();}}
    });
    app.addEventListener("change",event=>{const el=event.target;if(ui.screen==="lab")return;if(el.id==="importFile"&&el.files[0]){const reader=new FileReader();reader.onload=()=>{const result=E.importState(state,reader.result,dayNow());if(result.ok){state=result.state;warning="Backup imported.";ui.screen=profileChosen?"home":"nameGate";ui.session=null;localStorage.setItem(KEY,E.exportState(state));}else warning=result.error;render();};reader.readAsText(el.files[0]);return;}if(el.dataset.setting==="cap"){const v=Number(el.value);if(Number.isInteger(v)&&v>=0&&v<=20)state.settings.grownUpPracticeCap=v;}else if(el.dataset.setting==="timecap"){state.settings.grownUpSoftTimeCapMs=el.value===""?null:Math.max(1,Number(el.value))*60000;}else if(el.dataset.setting==="voice")state.settings.voiceURI=el.value;else if(el.dataset.setting==="rate")state.settings.speechRate=Number(el.value);else if(el.dataset.setting==="sound")state.settings.soundEnabled=Boolean(el.checked);else if(el.dataset.setting==="sound-volume")state.settings.soundVolume=Math.max(0,Math.min(1,Number(el.value)/100));else if(el.dataset.feedbackVoice)state.settings.feedbackVoiceByClass[el.dataset.feedbackVoice]=el.value;save();});
    app.addEventListener("submit",event=>{const form=event.target.closest(".name-gate-form");if(!form)return;event.preventDefault();const input=form.querySelector("#child-name-input");ui.nameGateInput=input?.value??"";const checked=validateChildNameInput(ui.nameGateInput);if(!checked.ok){ui.nameGateError=checked.error;render();return;}const persisted=saveChildNameRecord(checked.name);childNameRecord=loadChildNameRecord();childName=checked.name;profileChosen=true;if(!persisted)warning="The name works for this visit but cannot be saved in this browser.";ui.nameGateError="";ui.nameGateInput="";ui.screen="home";render();});
    document.addEventListener("keydown",event=>{
      const construction=(ui.screen==="session"||ui.screen==="capstone")&&["question","reteach"].includes(ui.phase)&&ui.question?.inputClass==="CONSTRUCTION";
      if(!construction||event.target.closest?.("[data-fraction-part]"))return;
      if(event.key===":"){
        beginManipulation();ui.entry+=":";ui.modelTouched=true;save();render();event.preventDefault();event.stopImmediatePropagation();
      }else if(/^[0-9./ -]$/.test(event.key)||event.key==="Backspace")beginManipulation();
    },true);
    document.addEventListener("keydown",event=>{
      if(ui.screen==="lab"){
        if(event.key==="Escape"){labStorageIntact();lab=null;ui.screen="grown";render();event.preventDefault();}
        else if(event.target.matches?.('[data-lab-action="line-mark"]')&&["ArrowLeft","ArrowRight"].includes(event.key)){const marks=[...app.querySelectorAll('[data-lab-action="line-mark"]')],index=marks.indexOf(event.target),next=marks[Math.max(0,Math.min(marks.length-1,index+(event.key==="ArrowRight"?1:-1)))];next?.click();event.preventDefault();}
        else if(event.key==="Enter"&&event.target.matches?.("[data-fraction-part]")&&lab.entry.trim()){gradeLabAnswer();event.preventDefault();}
        else if(!event.target.matches?.("input,select,textarea,button")&&labQuestionAt().inputClass==="SELECTION"&&/^[1-4]$/.test(event.key)){const option=labQuestionAt().options[Number(event.key)-1];if(option){app.querySelector('[data-option-id="'+CSS.escape(option.optionId)+'"]')?.click();event.preventDefault();}}
        else if(!event.target.matches?.("input,select,textarea,button")&&labQuestionAt().inputClass==="CONSTRUCTION"&&(/^[0-9./ :]$/.test(event.key)||event.key==="Backspace")){applyLabKey(event.key==="Backspace"?"⌫":event.key);renderLabAndFocus('[data-lab-action="grade"]');event.preventDefault();}
        else if(!event.target.matches?.("input,select,textarea,button")&&event.key==="Enter"&&((labQuestionAt().inputClass==="SELECTION"&&lab.selected!==null)||lab.entry.trim())){gradeLabAnswer();event.preventDefault();}
        else if(!event.target.matches?.("input,select,textarea,button")&&event.key==="ArrowLeft"&&lab.sampleOrdinal>0){lab.sampleOrdinal-=1;clearLabAnswer();renderLabAndFocus('[data-lab-action="previous"]');event.preventDefault();}
        else if(!event.target.matches?.("input,select,textarea,button")&&event.key==="ArrowRight"){lab.sampleOrdinal+=1;clearLabAnswer();renderLabAndFocus('[data-lab-action="next"]');event.preventDefault();}
        return;
      }
      if(ui.screen==="session"&&ui.phase==="pick"&&/^[12]$/.test(event.key)){
        chooseVariant(Number(event.key)-1);event.preventDefault();return;
      }
      if(ui.screen==="session"&&ui.phase==="physical"&&(event.key==="Enter"||event.key===" ")){
        ui.modelTouched=true;ui.phase="question";save();render();speak(ui.question.prompt,()=>{ui.promptFinishedAt=now();ui.idleStart=now();});event.preventDefault();return;
      }
      if((ui.screen==="session"||ui.screen==="capstone")&&["question","reteach"].includes(ui.phase)){
        if(ui.question.inputClass==="SELECTION"){
          if(/^[1-4]$/.test(event.key)){
            const option=ui.question.options[Number(event.key)-1];if(option){selectOption(option.optionId);event.preventDefault();}
          }else if(event.key===" "){
            const current=ui.question.options.findIndex(option=>option.optionId===ui.selected),option=ui.question.options[(current+1)%ui.question.options.length];selectOption(option.optionId);event.preventDefault();
          }else if(event.key==="Enter"&&ui.selected!==null){submit();event.preventDefault();}
        }else{
          if(event.target.closest?.("[data-fraction-part]")){
            if(event.key==="Enter"&&ui.entry.trim()){submit();event.preventDefault();}
            return;
          }
          if(/^[0-9./ -]$/.test(event.key)){
            ui.entry+=event.key;ui.modelTouched=true;save();render();event.preventDefault();
          }else if(event.key==="Backspace"){
            ui.entry=ui.entry.slice(0,-1);ui.modelTouched=true;save();render();event.preventDefault();
          }else if(event.key==="Enter"&&ui.entry.trim()){submit();event.preventDefault();}
        }
      }else if(ui.phase==="feedback"&&(event.key==="Enter"||event.key===" ")){
        if(ui.screen==="capstone")finish();else next();event.preventDefault();
      }
    });
    window.addEventListener("resize",()=>{if(ui.screen==="lab")requestAnimationFrame(updateLabLayoutSignals);},{passive:true});
    if("speechSynthesis" in window)speechSynthesis.onvoiceschanged=()=>{if(ui.screen==="grown")render();};
    setInterval(()=>{if(ui.screen==="session"&&!ui.isReteach)checkTimeCap();},500);
    const serviceWorkerEligible=location.protocol==="https:"||["127.0.0.1","localhost","::1"].includes(location.hostname);
    if(serviceWorkerEligible&&"serviceWorker" in navigator)navigator.serviceWorker.register("sw.js",{scope:"./"}).catch(()=>{});
    if(!resumeActive())render();
  })();
  </script>
