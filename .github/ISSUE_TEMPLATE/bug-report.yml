name: Bug report
description: Report a reproducible game, math, accessibility, or visual problem.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not attach a game backup or include a child's name, school, address,
        email, account name, or other identifying information.
  - type: input
    id: skill
    attributes:
      label: Skill, level, and tier
      description: Use the neutral identifiers shown in Parent test, if available.
      placeholder: "Example: MQ-048, level 8, HARD/TARGET"
  - type: input
    id: environment
    attributes:
      label: Device and browser
      placeholder: "Example: iPad Safari, portrait"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use invented names and data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not attach a backup or include identifying child/family information.
          required: true
        - label: Any screenshot is cropped to the game and has been checked for identifying information.
          required: true
