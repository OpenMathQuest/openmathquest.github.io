name: Deploy Math Quest to Pages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact annotated beta tag to deploy
        required: true
        type: string
        default: v1.0.0-beta.4

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    outputs:
      release_commit: ${{ steps.release_identity.outputs.commit }}
      release_tag: ${{ steps.release_identity.outputs.tag }}
      snapshot_sha256: ${{ steps.snapshot.outputs.sha256 }}
    permissions:
      actions: read
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - name: Require approved release dispatch boundary
        shell: bash
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != "OpenMathQuest/openmathquest.github.io" ]] ||
             [[ "$GITHUB_REF" != "refs/heads/main" ]] ||
             [[ "$GITHUB_REF_TYPE" != "branch" ]] ||
             [[ "$GITHUB_REF_NAME" != "main" ]] ||
             [[ "$RELEASE_TAG_INPUT" != "v1.0.0-beta.4" ]]
          then
            echo "::error::Deploy only OpenMathQuest Public Beta 4 from the protected main branch."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          ref: refs/tags/${{ inputs.release_tag }}

      - name: Verify exact tagged release
        id: release_identity
        shell: bash
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          expected_repository="OpenMathQuest/openmathquest.github.io"
          if [[ "$GITHUB_REPOSITORY" != "$expected_repository" ]]; then
            echo "::error::This release workflow may run only in $expected_repository."
            exit 1
          fi

          mapfile -t version_lines < VERSION
          if (( ${#version_lines[@]} != 1 )) ||
             [[ ! "${version_lines[0]}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]
          then
            echo "::error::VERSION must contain exactly one beta semantic version."
            exit 1
          fi
          version="${version_lines[0]}"
          expected_tag="v${version}"
          expected_ref="refs/tags/${expected_tag}"
          if [[ "$RELEASE_TAG_INPUT" != "$expected_tag" ]]; then
            echo "::error::The release_tag input must exactly match $expected_tag."
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/main" ]] ||
             [[ "$GITHUB_REF_TYPE" != "branch" ]] ||
             [[ "$GITHUB_REF_NAME" != "main" ]]
          then
            echo "::error::Dispatch this release workflow from the protected main branch."
            exit 1
          fi
          if ! git show-ref --verify --quiet "$expected_ref"; then
            echo "::error::The expected release tag is not present in the checked-out repository."
            exit 1
          fi
          if [[ "$(git cat-file -t "$expected_ref")" != "tag" ]]; then
            echo "::error::$expected_tag must be an annotated tag."
            exit 1
          fi

          tag_commit="$(git rev-parse "${expected_ref}^{commit}")"
          head_commit="$(git rev-parse "HEAD^{commit}")"
          event_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          if [[ "$head_commit" != "$tag_commit" ]] ||
             [[ "$event_commit" != "$tag_commit" ]]
          then
            echo "::error::The main-branch dispatch, checkout, and annotated release tag do not resolve to one commit."
            exit 1
          fi
          printf 'tag=%s\n' "$expected_tag" >> "$GITHUB_OUTPUT"
          printf 'commit=%s\n' "$tag_commit" >> "$GITHUB_OUTPUT"

      - name: Require successful certification of the exact frozen commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.release_identity.outputs.commit }}
        run: |
          set -euo pipefail
          runs_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/audit.yml/runs?head_sha=${RELEASE_COMMIT}&event=workflow_dispatch&status=completed&per_page=100")"
          if ! jq -e --arg sha "$RELEASE_COMMIT" '
            [.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success")] | length >= 1
          ' <<< "$runs_json" >/dev/null
          then
            echo "::error::No successful release-certification run is bound to commit $RELEASE_COMMIT."
            exit 1
          fi

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.0
          package-manager-cache: false

      - name: Reject private, legacy, or unregistered material
        id: public_payload
        shell: bash
        run: |
          set -euo pipefail
          guard_output="$(node audit/public-candidate-guard.mjs)"
          printf '%s\n' "$guard_output"
          mapfile -t payload_sha256 < <(printf '%s\n' "$guard_output" | sed -n 's/^PUBLIC_PAYLOAD_SHA256=//p')
          mapfile -t payload_tree_oid < <(printf '%s\n' "$guard_output" | sed -n 's/^PUBLIC_PAYLOAD_TREE_OID=//p')
          if (( ${#payload_sha256[@]} != 1 )) ||
             (( ${#payload_tree_oid[@]} != 1 )) ||
             [[ ! "${payload_sha256[0]}" =~ ^[a-f0-9]{64}$ ]] ||
             [[ ! "${payload_tree_oid[0]}" =~ ^([a-f0-9]{40}|[a-f0-9]{64})$ ]]
          then
            echo "::error::The public-candidate guard did not emit one valid payload identity."
            exit 1
          fi
          printf 'sha256=%s\n' "${payload_sha256[0]}" >> "$GITHUB_OUTPUT"
          printf 'tree_oid=%s\n' "${payload_tree_oid[0]}" >> "$GITHUB_OUTPUT"

      - name: Validate versioned curriculum manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          manifest_output="$(node --input-type=module -e '
            import { CURRICULUM_PATH, loadManifest } from "./audit/lib/curriculum-manifest.mjs";
            const loaded = await loadManifest(CURRICULUM_PATH);
            const strands = new Set(loaded.manifest.skills.map((skill) => skill.strand));
            const completeLevels = loaded.manifest.levels.every((level) => {
              const skills = loaded.manifest.skills.filter((skill) => skill.level === level.number);
              return skills.length === loaded.manifest.counts.skillsPerLevel;
            });
            if (loaded.manifest.levels.length !== 21 || strands.size !== 6 || loaded.manifest.skills.length !== 126 || !completeLevels) {
              throw new Error(`Expected 21 six-skill levels and 126 skills across 6 declared strands; found ${loaded.manifest.levels.length} levels, ${strands.size} strands, and ${loaded.manifest.skills.length} skills.`);
            }
            process.stdout.write(`${loaded.manifest.version}\n${loaded.sha256}\n${loaded.manifest.levels.length}\n${strands.size}\n${loaded.manifest.skills.length}\n`);
          ')"
          mapfile -t manifest_metadata <<< "$manifest_output"
          if (( ${#manifest_metadata[@]} != 5 )) ||
             [[ ! "${manifest_metadata[0]}" =~ ^1\.[0-9]+\.[0-9]+$ ]] ||
             [[ ! "${manifest_metadata[1]}" =~ ^[a-f0-9]{64}$ ]] ||
             [[ "${manifest_metadata[2]}" != "21" ]] ||
             [[ "${manifest_metadata[3]}" != "6" ]] ||
             [[ "${manifest_metadata[4]}" != "126" ]]
          then
            echo "::error::The canonical curriculum manifest metadata is invalid."
            exit 1
          fi
          printf 'version=%s\n' "${manifest_metadata[0]}" >> "$GITHUB_OUTPUT"
          printf 'sha256=%s\n' "${manifest_metadata[1]}" >> "$GITHUB_OUTPUT"

      - name: Verify the public payload remained unchanged
        shell: bash
        env:
          INITIAL_PAYLOAD_SHA256: ${{ steps.public_payload.outputs.sha256 }}
          INITIAL_PAYLOAD_TREE_OID: ${{ steps.public_payload.outputs.tree_oid }}
        run: |
          set -euo pipefail
          guard_output="$(node audit/public-candidate-guard.mjs)"
          printf '%s\n' "$guard_output"
          mapfile -t payload_sha256 < <(printf '%s\n' "$guard_output" | sed -n 's/^PUBLIC_PAYLOAD_SHA256=//p')
          mapfile -t payload_tree_oid < <(printf '%s\n' "$guard_output" | sed -n 's/^PUBLIC_PAYLOAD_TREE_OID=//p')
          if (( ${#payload_sha256[@]} != 1 )) ||
             (( ${#payload_tree_oid[@]} != 1 )) ||
             [[ "${payload_sha256[0]}" != "$INITIAL_PAYLOAD_SHA256" ]] ||
             [[ "${payload_tree_oid[0]}" != "$INITIAL_PAYLOAD_TREE_OID" ]]
          then
            echo "::error::The public payload changed while release checks were running."
            exit 1
          fi

      - name: Require reviewed publication clearance
        env:
          MQ_PUBLIC_PAYLOAD_SHA256: ${{ steps.public_payload.outputs.sha256 }}
          MQ_PUBLIC_PAYLOAD_TREE_OID: ${{ steps.public_payload.outputs.tree_oid }}
        run: node audit/validate-publication-clearance.mjs

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Verify organization-root Pages configuration
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
          PAGES_HOST: ${{ steps.pages.outputs.host }}
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
        run: |
          set -euo pipefail
          expected_url="https://openmathquest.github.io"
          expected_host="openmathquest.github.io"
          if [[ "$PAGES_BASE_URL" != "$expected_url" ]] ||
             [[ "$PAGES_ORIGIN" != "$expected_url" ]] ||
             [[ "$PAGES_HOST" != "$expected_host" ]] ||
             [[ -n "$PAGES_BASE_PATH" ]]
          then
            echo "::error::configure-pages did not resolve the exact OpenMathQuest organization-root site."
            exit 1
          fi

          actual_domain="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.cname // ""' | tr '[:upper:]' '[:lower:]')"
          actual_url="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.html_url // ""')"
          build_type="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type // ""')"
          https_enforced="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.https_enforced // false')"
          if [[ -n "$actual_domain" ]]; then
            echo "::error::The organization-root Pages site must not have a custom CNAME."
            exit 1
          fi
          if [[ "${actual_url%/}" != "$expected_url" ]]; then
            echo "::error::GitHub Pages URL '$actual_url' is not the approved organization-root URL."
            exit 1
          fi
          if [[ "$build_type" != "workflow" ]]; then
            echo "::error::GitHub Pages publishing source must be GitHub Actions."
            exit 1
          fi
          if [[ "$https_enforced" != "true" ]]; then
            echo "::error::GitHub Pages must enforce HTTPS before deploying."
            exit 1
          fi

      - name: Construct, verify, and seal exact tagged Pages snapshot
        id: snapshot
        shell: bash
        env:
          RELEASE_COMMIT: ${{ steps.release_identity.outputs.commit }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import { createHash } from "node:crypto";
          import {
            appendFile,
            chmod,
            mkdir,
            readFile,
            rm,
            writeFile,
          } from "node:fs/promises";
          import path from "node:path";

          const releaseCommit = process.env.RELEASE_COMMIT || "";
          if (!/^[a-f0-9]{40}$/u.test(releaseCommit)) {
            throw new Error("The verified release commit is not a SHA-1 commit identity.");
          }
          const checkedOutCommit = execFileSync(
            "git",
            ["rev-parse", "HEAD^{commit}"],
            { encoding: "utf8" },
          ).trim();
          if (checkedOutCommit !== releaseCommit) {
            throw new Error("The checkout moved after the release identity gate.");
          }

          const artifactSpecs = Object.freeze([
            [".nojekyll", "application/octet-stream", false],
            ["assets/fonts/Inter-Variable.ttf", "font/ttf", true],
            ["assets/icons/apple-touch-icon.png", "image/png", true],
            ["assets/icons/icon-192.png", "image/png", true],
            ["assets/icons/icon-512.png", "image/png", true],
            ["assets/sounds/close.wav", "audio/wav", true],
            ["assets/sounds/confirm.wav", "audio/wav", true],
            ["assets/sounds/incorrect.wav", "audio/wav", true],
            ["assets/sounds/tap.wav", "audio/wav", true],
            ["curriculum/math-quest-manifest-v1.json", "application/json", true],
            ["curriculum/PROVENANCE.md", "text/markdown", true],
            ["index.html", "text/html", true],
            ["manifest.webmanifest", "application/manifest+json", true],
            ["release-shell-v1.json", "application/json", true],
            ["sw.js", "text/javascript", true],
            ["LICENSE", "application/octet-stream", true],
            ["OPEN_SOURCE_POLICY.md", "text/markdown", true],
            ["PRIVACY.md", "text/markdown", true],
            ["THIRD_PARTY_NOTICES.md", "text/markdown", true],
            ["licenses/Inter-OFL.txt", "text/plain", true],
            ["licenses/app-icons.md", "text/markdown", true],
            ["licenses/component-register-v1.json", "application/json", true],
            ["licenses/sound-effects.md", "text/markdown", true],
          ]);
          const releaseBoundSpecs = new Map([
            ["assets/fonts/Inter-Variable.ttf", "font/ttf"],
            ["assets/icons/apple-touch-icon.png", "image/png"],
            ["assets/icons/icon-192.png", "image/png"],
            ["assets/icons/icon-512.png", "image/png"],
            ["assets/sounds/close.wav", "audio/wav"],
            ["assets/sounds/confirm.wav", "audio/wav"],
            ["assets/sounds/incorrect.wav", "audio/wav"],
            ["assets/sounds/tap.wav", "audio/wav"],
            ["index.html", "text/html"],
            ["manifest.webmanifest", "application/manifest+json"],
            ["LICENSE", "application/octet-stream"],
            ["PRIVACY.md", "text/markdown"],
            ["THIRD_PARTY_NOTICES.md", "text/markdown"],
          ]);
          const expectedRuntimeAssets = [...releaseBoundSpecs.keys()]
            .filter((entry) => entry.startsWith("assets/"))
            .sort();
          const artifactMime = new Map(
            artifactSpecs.map(([artifactPath, mime]) => [artifactPath, mime]),
          );
          if (artifactMime.size !== artifactSpecs.length) {
            throw new Error("The Pages artifact allowlist contains a duplicate path.");
          }

          const sha256 = (bytes) =>
            createHash("sha256").update(bytes).digest("hex");
          const gitBlob = (artifactPath) => {
            const record = execFileSync(
              "git",
              ["ls-tree", "-z", releaseCommit, "--", artifactPath],
              { maxBuffer: 8 * 1024 * 1024 },
            ).toString("utf8");
            const match = record.match(
              /^100644 blob ([a-f0-9]{40}|[a-f0-9]{64})\t([^\0]+)\0$/u,
            );
            if (!match || match[2] !== artifactPath) {
              throw new Error(
                `Tagged artifact '${artifactPath}' is absent, non-regular, executable, or ambiguous.`,
              );
            }
            return execFileSync(
              "git",
              ["cat-file", "blob", match[1]],
              { maxBuffer: 8 * 1024 * 1024 },
            );
          };

          const siteRoot = path.resolve("_site");
          await rm(siteRoot, { recursive: true, force: true });
          await mkdir(siteRoot, { recursive: false, mode: 0o755 });
          const taggedBlobs = new Map();
          const snapshotFiles = new Map();
          for (const [artifactPath, , tracked] of artifactSpecs) {
            const bytes = tracked ? gitBlob(artifactPath) : Buffer.alloc(0);
            if (tracked) taggedBlobs.set(artifactPath, bytes);
            const destination = path.join(siteRoot, ...artifactPath.split("/"));
            if (!destination.startsWith(`${siteRoot}${path.sep}`)) {
              throw new Error(`Artifact path '${artifactPath}' escaped _site.`);
            }
            await mkdir(path.dirname(destination), { recursive: true, mode: 0o755 });
            await writeFile(destination, bytes, { mode: 0o444, flag: "wx" });
            snapshotFiles.set(artifactPath, bytes);
          }

          const releaseManifestBytes = snapshotFiles.get("release-shell-v1.json");
          const releaseManifest = JSON.parse(releaseManifestBytes.toString("utf8"));
          if (
            releaseManifest.schemaVersion !== 1 ||
            releaseManifest.entryPath !== "./index.html" ||
            JSON.stringify(releaseManifest.excludedPaths) !==
              JSON.stringify(["./release-shell-v1.json", "./sw.js"]) ||
            !Array.isArray(releaseManifest.entries)
          ) {
            throw new Error("The tagged release-shell manifest has an invalid closed schema.");
          }
          const boundEntries = new Map();
          for (const entry of releaseManifest.entries) {
            const keys = Object.keys(entry);
            if (
              JSON.stringify(keys) !==
                JSON.stringify(["path", "sha256", "bytes", "mime", "status"]) ||
              typeof entry.path !== "string" ||
              !entry.path.startsWith("./")
            ) {
              throw new Error("A release-shell entry is non-canonical.");
            }
            const artifactPath = entry.path.slice(2);
            if (boundEntries.has(artifactPath)) {
              throw new Error(`Duplicate release-shell entry '${entry.path}'.`);
            }
            boundEntries.set(artifactPath, entry);
          }
          if (
            boundEntries.size !== releaseBoundSpecs.size ||
            [...releaseBoundSpecs.keys()].some((entry) => !boundEntries.has(entry))
          ) {
            throw new Error("The release-shell entry set is not the approved closed set.");
          }
          for (const [artifactPath, expectedMime] of releaseBoundSpecs) {
            const entry = boundEntries.get(artifactPath);
            const bytes = snapshotFiles.get(artifactPath);
            if (
              !bytes ||
              entry.sha256 !== sha256(bytes) ||
              entry.bytes !== bytes.byteLength ||
              entry.mime !== expectedMime ||
              entry.status !== 200
            ) {
              throw new Error(
                `Release-shell binding failed for '${artifactPath}' (bytes, hash, MIME, or status).`,
              );
            }
          }

          const manifestSha256 = sha256(releaseManifestBytes);
          const workerText = snapshotFiles.get("sw.js").toString("utf8");
          const workerBindings = [
            ...workerText.matchAll(
              /const RELEASE_MANIFEST_SHA256 = "([a-f0-9]{64})";/gu,
            ),
          ];
          if (
            workerBindings.length !== 1 ||
            workerBindings[0][1] !== manifestSha256
          ) {
            throw new Error("The tagged service worker is not bound to the tagged release-shell bytes.");
          }

          const referencedAssets = [
            ...new Set(
              `${snapshotFiles.get("index.html").toString("utf8")}\n${
                snapshotFiles.get("manifest.webmanifest").toString("utf8")
              }`.match(
                /assets\/[A-Za-z0-9._/-]+\.(?:ttf|otf|woff2?|wav|mp3|ogg|png|svg|jpe?g|gif|webp|json|webmanifest)/gu,
              ) || [],
            ),
          ].sort();
          if (
            JSON.stringify(referencedAssets) !==
            JSON.stringify(expectedRuntimeAssets)
          ) {
            throw new Error("The tagged runtime asset references differ from the closed Pages allowlist.");
          }

          const machinePath =
            /([A-Za-z]:\\Us[e]rs\\|file:\/\/\/[A-Za-z]:\/Us[e]rs\/|\/Us[e]rs\/[^/]+\/|\/ho[m]e\/[^/]+\/)/iu;
          for (const [artifactPath, mime] of artifactMime) {
            if (
              (mime.startsWith("text/") ||
                mime === "application/json" ||
                mime === "application/manifest+json") &&
              machinePath.test(snapshotFiles.get(artifactPath).toString("utf8"))
            ) {
              throw new Error(`Machine-specific path found in '${artifactPath}'.`);
            }
          }

          let nonBoundComparisons = 0;
          for (const [artifactPath, , tracked] of artifactSpecs) {
            const snapshotBytes = await readFile(
              path.join(siteRoot, ...artifactPath.split("/")),
            );
            if (!snapshotBytes.equals(snapshotFiles.get(artifactPath))) {
              throw new Error(`Snapshot file '${artifactPath}' changed during validation.`);
            }
            if (tracked && !releaseBoundSpecs.has(artifactPath)) {
              if (!snapshotBytes.equals(taggedBlobs.get(artifactPath))) {
                throw new Error(`Snapshot file '${artifactPath}' differs from its tagged Git blob.`);
              }
              nonBoundComparisons += 1;
            }
          }
          const expectedNonBoundComparisons =
            artifactSpecs.filter(
              ([artifactPath, , tracked]) =>
                tracked && !releaseBoundSpecs.has(artifactPath),
            ).length;
          if (nonBoundComparisons !== expectedNonBoundComparisons) {
            throw new Error("Not every non-shell artifact was compared with its tagged Git blob.");
          }

          const canonicalRecords = [...artifactSpecs]
            .sort(([left], [right]) => (left < right ? -1 : left > right ? 1 : 0))
            .map(([artifactPath, mime]) => {
              const bytes = snapshotFiles.get(artifactPath);
              return `${artifactPath}\t${bytes.byteLength}\t${sha256(bytes)}\t${mime}`;
            });
          const snapshotSha256 = sha256(
            Buffer.from(`${canonicalRecords.join("\n")}\n`, "utf8"),
          );

          for (const [artifactPath] of artifactSpecs) {
            await chmod(
              path.join(siteRoot, ...artifactPath.split("/")),
              0o444,
            );
          }
          const directories = new Set([siteRoot]);
          for (const [artifactPath] of artifactSpecs) {
            let directory = path.dirname(
              path.join(siteRoot, ...artifactPath.split("/")),
            );
            while (directory.startsWith(siteRoot)) {
              directories.add(directory);
              if (directory === siteRoot) break;
              directory = path.dirname(directory);
            }
          }
          for (const directory of [...directories].sort((left, right) => right.length - left.length)) {
            await chmod(directory, 0o555);
          }

          await appendFile(
            process.env.GITHUB_OUTPUT,
            `sha256=${snapshotSha256}\nfile_count=${artifactSpecs.length}\n`,
            "utf8",
          );
          await appendFile(
            process.env.GITHUB_STEP_SUMMARY,
            `Verified tagged Pages snapshot: \`${snapshotSha256}\` (${artifactSpecs.length} files).\n`,
            "utf8",
          );
          process.stdout.write(
            `PAGES_SNAPSHOT_SHA256=${snapshotSha256}\nPAGES_SNAPSHOT_FILES=${artifactSpecs.length}\n`,
          );
          NODE

          test -z "$(find _site -type l -print -quit)"
          test -z "$(find _site -perm /222 -print -quit)"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Verify deployed organization-root URL
        shell: bash
        env:
          DEPLOYED_URL: ${{ steps.deployment.outputs.page_url }}
          RELEASE_COMMIT: ${{ needs.build.outputs.release_commit }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          SNAPSHOT_SHA256: ${{ needs.build.outputs.snapshot_sha256 }}
        run: |
          set -euo pipefail
          if [[ "${DEPLOYED_URL%/}/" != "https://openmathquest.github.io/" ]]; then
            echo "::error::The Pages deployment did not report the approved organization-root URL."
            exit 1
          fi
          if [[ -z "$RELEASE_COMMIT" ]] ||
             [[ ! "$RELEASE_COMMIT" =~ ^[a-f0-9]{40}$ ]] ||
             [[ "$RELEASE_TAG" != "v1.0.0-beta.4" ]] ||
             [[ ! "$SNAPSHOT_SHA256" =~ ^[a-f0-9]{64}$ ]]
          then
            echo "::error::The deployment is not bound to the verified Public Beta 4 tag, commit, and immutable snapshot."
            exit 1
          fi
