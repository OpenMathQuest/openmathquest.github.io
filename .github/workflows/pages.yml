name: Deploy Math Quest to Pages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact annotated beta tag to deploy
        required: true
        type: string
        default: v1.0.0-beta.1

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    outputs:
      release_commit: ${{ steps.release_identity.outputs.commit }}
      release_tag: ${{ steps.release_identity.outputs.tag }}
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - name: Require approved release dispatch boundary
        shell: bash
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != "OpenMathQuest/openmathquest.github.io" ]] ||
             [[ "$GITHUB_REF" != "refs/heads/main" ]] ||
             [[ "$GITHUB_REF_TYPE" != "branch" ]] ||
             [[ "$GITHUB_REF_NAME" != "main" ]] ||
             [[ "$RELEASE_TAG_INPUT" != "v1.0.0-beta.1" ]]
          then
            echo "::error::Deploy only OpenMathQuest Public Beta 1 from the protected main branch."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          ref: refs/tags/${{ inputs.release_tag }}

      - name: Verify exact tagged release
        id: release_identity
        shell: bash
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          expected_repository="OpenMathQuest/openmathquest.github.io"
          if [[ "$GITHUB_REPOSITORY" != "$expected_repository" ]]; then
            echo "::error::This release workflow may run only in $expected_repository."
            exit 1
          fi

          mapfile -t version_lines < VERSION
          if (( ${#version_lines[@]} != 1 )) ||
             [[ ! "${version_lines[0]}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]
          then
            echo "::error::VERSION must contain exactly one beta semantic version."
            exit 1
          fi
          version="${version_lines[0]}"
          expected_tag="v${version}"
          expected_ref="refs/tags/${expected_tag}"
          if [[ "$RELEASE_TAG_INPUT" != "$expected_tag" ]]; then
            echo "::error::The release_tag input must exactly match $expected_tag."
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/main" ]] ||
             [[ "$GITHUB_REF_TYPE" != "branch" ]] ||
             [[ "$GITHUB_REF_NAME" != "main" ]]
          then
            echo "::error::Dispatch this release workflow from the protected main branch."
            exit 1
          fi
          if ! git show-ref --verify --quiet "$expected_ref"; then
            echo "::error::The expected release tag is not present in the checked-out repository."
            exit 1
          fi
          if [[ "$(git cat-file -t "$expected_ref")" != "tag" ]]; then
            echo "::error::$expected_tag must be an annotated tag."
            exit 1
          fi

          tag_commit="$(git rev-parse "${expected_ref}^{commit}")"
          head_commit="$(git rev-parse "HEAD^{commit}")"
          event_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          if [[ "$head_commit" != "$tag_commit" ]] ||
             [[ "$event_commit" != "$tag_commit" ]]
          then
            echo "::error::The main-branch dispatch, checkout, and annotated release tag do not resolve to one commit."
            exit 1
          fi
          printf 'tag=%s\n' "$expected_tag" >> "$GITHUB_OUTPUT"
          printf 'commit=%s\n' "$tag_commit" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.0
          package-manager-cache: false

      - name: Reject private, legacy, or unregistered material
        id: public_payload
        shell: bash
        run: |
          set -euo pipefail
          guard_output="$(node audit/public-candidate-guard.mjs)"
          printf '%s\n' "$guard_output"
          mapfile -t payload_sha256 < <(printf '%s\n' "$guard_output" | sed -n 's/^PUBLIC_PAYLOAD_SHA256=//p')
          mapfile -t payload_tree_oid < <(printf '%s\n' "$guard_output" | sed -n 's/^PUBLIC_PAYLOAD_TREE_OID=//p')
          if (( ${#payload_sha256[@]} != 1 )) ||
             (( ${#payload_tree_oid[@]} != 1 )) ||
             [[ ! "${payload_sha256[0]}" =~ ^[a-f0-9]{64}$ ]] ||
             [[ ! "${payload_tree_oid[0]}" =~ ^([a-f0-9]{40}|[a-f0-9]{64})$ ]]
          then
            echo "::error::The public-candidate guard did not emit one valid payload identity."
            exit 1
          fi
          printf 'sha256=%s\n' "${payload_sha256[0]}" >> "$GITHUB_OUTPUT"
          printf 'tree_oid=%s\n' "${payload_tree_oid[0]}" >> "$GITHUB_OUTPUT"

      - name: Validate versioned curriculum manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          manifest_output="$(node --input-type=module -e '
            import { CURRICULUM_PATH, loadManifest } from "./audit/lib/curriculum-manifest.mjs";
            const loaded = await loadManifest(CURRICULUM_PATH);
            const strands = new Set(loaded.manifest.skills.map((skill) => skill.strand));
            const completeLevels = loaded.manifest.levels.every((level) => {
              const skills = loaded.manifest.skills.filter((skill) => skill.level === level.number);
              return skills.length === loaded.manifest.counts.skillsPerLevel;
            });
            if (loaded.manifest.levels.length !== 21 || strands.size !== 6 || loaded.manifest.skills.length !== 126 || !completeLevels) {
              throw new Error(`Expected 21 six-skill levels and 126 skills across 6 declared strands; found ${loaded.manifest.levels.length} levels, ${strands.size} strands, and ${loaded.manifest.skills.length} skills.`);
            }
            process.stdout.write(`${loaded.manifest.version}\n${loaded.sha256}\n${loaded.manifest.levels.length}\n${strands.size}\n${loaded.manifest.skills.length}\n`);
          ')"
          mapfile -t manifest_metadata <<< "$manifest_output"
          if (( ${#manifest_metadata[@]} != 5 )) ||
             [[ ! "${manifest_metadata[0]}" =~ ^1\.[0-9]+\.[0-9]+$ ]] ||
             [[ ! "${manifest_metadata[1]}" =~ ^[a-f0-9]{64}$ ]] ||
             [[ "${manifest_metadata[2]}" != "21" ]] ||
             [[ "${manifest_metadata[3]}" != "6" ]] ||
             [[ "${manifest_metadata[4]}" != "126" ]]
          then
            echo "::error::The canonical curriculum manifest metadata is invalid."
            exit 1
          fi
          printf 'version=%s\n' "${manifest_metadata[0]}" >> "$GITHUB_OUTPUT"
          printf 'sha256=%s\n' "${manifest_metadata[1]}" >> "$GITHUB_OUTPUT"

      - name: Run exact-engine and semantic tests
        run: node --test audit/tests/node-engine.test.mjs

      - name: Require calibrated exact-engine branch coverage
        run: node audit/run-coverage.mjs

      - name: Kill all representative mutation families
        run: node audit/mutation-runner.mjs

      - name: Exhaust every manifest generator contract
        run: node audit/exhaustive-generator-audit.mjs

      - name: Verify the public payload remained unchanged
        shell: bash
        env:
          INITIAL_PAYLOAD_SHA256: ${{ steps.public_payload.outputs.sha256 }}
          INITIAL_PAYLOAD_TREE_OID: ${{ steps.public_payload.outputs.tree_oid }}
        run: |
          set -euo pipefail
          guard_output="$(node audit/public-candidate-guard.mjs)"
          printf '%s\n' "$guard_output"
          mapfile -t payload_sha256 < <(printf '%s\n' "$guard_output" | sed -n 's/^PUBLIC_PAYLOAD_SHA256=//p')
          mapfile -t payload_tree_oid < <(printf '%s\n' "$guard_output" | sed -n 's/^PUBLIC_PAYLOAD_TREE_OID=//p')
          if (( ${#payload_sha256[@]} != 1 )) ||
             (( ${#payload_tree_oid[@]} != 1 )) ||
             [[ "${payload_sha256[0]}" != "$INITIAL_PAYLOAD_SHA256" ]] ||
             [[ "${payload_tree_oid[0]}" != "$INITIAL_PAYLOAD_TREE_OID" ]]
          then
            echo "::error::The public payload changed while release checks were running."
            exit 1
          fi

      - name: Require reviewed publication clearance
        env:
          MQ_PUBLIC_PAYLOAD_SHA256: ${{ steps.public_payload.outputs.sha256 }}
          MQ_PUBLIC_PAYLOAD_TREE_OID: ${{ steps.public_payload.outputs.tree_oid }}
        run: node audit/validate-publication-clearance.mjs

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Verify organization-root Pages configuration
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
          PAGES_HOST: ${{ steps.pages.outputs.host }}
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
        run: |
          set -euo pipefail
          expected_url="https://openmathquest.github.io"
          expected_host="openmathquest.github.io"
          if [[ "$PAGES_BASE_URL" != "$expected_url" ]] ||
             [[ "$PAGES_ORIGIN" != "$expected_url" ]] ||
             [[ "$PAGES_HOST" != "$expected_host" ]] ||
             [[ -n "$PAGES_BASE_PATH" ]]
          then
            echo "::error::configure-pages did not resolve the exact OpenMathQuest organization-root site."
            exit 1
          fi

          actual_domain="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.cname // ""' | tr '[:upper:]' '[:lower:]')"
          actual_url="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.html_url // ""')"
          build_type="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type // ""')"
          https_enforced="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.https_enforced // false')"
          if [[ -n "$actual_domain" ]]; then
            echo "::error::The organization-root Pages site must not have a custom CNAME."
            exit 1
          fi
          if [[ "${actual_url%/}" != "$expected_url" ]]; then
            echo "::error::GitHub Pages URL '$actual_url' is not the approved organization-root URL."
            exit 1
          fi
          if [[ "$build_type" != "workflow" ]]; then
            echo "::error::GitHub Pages publishing source must be GitHub Actions."
            exit 1
          fi
          if [[ "$https_enforced" != "true" ]]; then
            echo "::error::GitHub Pages must enforce HTTPS before deploying."
            exit 1
          fi

      - name: Build explicit runtime allowlist
        shell: bash
        run: |
          set -euo pipefail
          install -d _site/assets/fonts _site/assets/icons _site/assets/sounds _site/curriculum
          install -m 0644 index.html _site/index.html
          install -m 0644 manifest.webmanifest _site/manifest.webmanifest
          install -m 0644 sw.js _site/sw.js
          install -m 0644 assets/fonts/Inter-Variable.ttf _site/assets/fonts/Inter-Variable.ttf
          install -m 0644 assets/icons/apple-touch-icon.png _site/assets/icons/apple-touch-icon.png
          install -m 0644 assets/icons/icon-192.png _site/assets/icons/icon-192.png
          install -m 0644 assets/icons/icon-512.png _site/assets/icons/icon-512.png
          install -m 0644 assets/sounds/tap.wav _site/assets/sounds/tap.wav
          install -m 0644 assets/sounds/confirm.wav _site/assets/sounds/confirm.wav
          install -m 0644 assets/sounds/incorrect.wav _site/assets/sounds/incorrect.wav
          install -m 0644 assets/sounds/close.wav _site/assets/sounds/close.wav
          test -f LICENSE
          install -m 0644 LICENSE _site/LICENSE
          install -m 0644 OPEN_SOURCE_POLICY.md _site/OPEN_SOURCE_POLICY.md
          install -m 0644 PRIVACY.md _site/PRIVACY.md
          install -m 0644 THIRD_PARTY_NOTICES.md _site/THIRD_PARTY_NOTICES.md
          install -d _site/licenses
          install -m 0644 licenses/Inter-OFL.txt _site/licenses/Inter-OFL.txt
          install -m 0644 licenses/app-icons.md _site/licenses/app-icons.md
          install -m 0644 licenses/component-register-v1.json _site/licenses/component-register-v1.json
          install -m 0644 licenses/sound-effects.md _site/licenses/sound-effects.md
          install -m 0644 curriculum/math-quest-manifest-v1.json _site/curriculum/math-quest-manifest-v1.json
          install -m 0644 curriculum/PROVENANCE.md _site/curriculum/PROVENANCE.md
          touch _site/.nojekyll

      - name: Verify Pages artifact allowlist
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            'assets/fonts/Inter-Variable.ttf' \
            'assets/icons/apple-touch-icon.png' \
            'assets/icons/icon-192.png' \
            'assets/icons/icon-512.png' \
            'assets/sounds/close.wav' \
            'assets/sounds/confirm.wav' \
            'assets/sounds/incorrect.wav' \
            'assets/sounds/tap.wav' \
            | LC_ALL=C sort > expected-runtime-assets.txt
          grep -Eo \
            'assets/[A-Za-z0-9._/-]+\.(ttf|otf|woff|woff2|wav|mp3|ogg|png|svg|jpg|jpeg|gif|webp|json|webmanifest)' \
            index.html manifest.webmanifest \
            | LC_ALL=C sort -u > referenced-runtime-assets.txt
          diff -u expected-runtime-assets.txt referenced-runtime-assets.txt

          find _site -type f -printf '%P\n' | LC_ALL=C sort > actual-files.txt
          {
            printf '%s\n' \
              '.nojekyll' \
              'assets/fonts/Inter-Variable.ttf' \
              'assets/icons/apple-touch-icon.png' \
              'assets/icons/icon-192.png' \
              'assets/icons/icon-512.png' \
              'assets/sounds/close.wav' \
              'assets/sounds/confirm.wav' \
              'assets/sounds/incorrect.wav' \
              'assets/sounds/tap.wav' \
              'curriculum/math-quest-manifest-v1.json' \
              'curriculum/PROVENANCE.md' \
              'index.html' \
              'manifest.webmanifest' \
              'sw.js' \
              'LICENSE' \
              'OPEN_SOURCE_POLICY.md' \
              'PRIVACY.md' \
              'THIRD_PARTY_NOTICES.md' \
              'licenses/Inter-OFL.txt' \
              'licenses/app-icons.md' \
              'licenses/component-register-v1.json' \
              'licenses/sound-effects.md'
          } | LC_ALL=C sort > expected-files.txt
          diff -u expected-files.txt actual-files.txt
          test -z "$(find _site -type l -print -quit)"
          cmp manifest.webmanifest _site/manifest.webmanifest
          cmp sw.js _site/sw.js
          cmp curriculum/math-quest-manifest-v1.json _site/curriculum/math-quest-manifest-v1.json
          cmp curriculum/PROVENANCE.md _site/curriculum/PROVENANCE.md
          grep -F '"./manifest.webmanifest"' sw.js

          if grep -RIlE \
            '([A-Za-z]:\\Us[e]rs\\|file:///[A-Za-z]:/Us[e]rs/|/Us[e]rs/[^/]+/|/ho[m]e/[^/]+/)' \
            _site \
            --exclude='*.wav' \
            --exclude='*.ttf'
          then
            echo "A machine-specific path was found in the public artifact."
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Verify deployed organization-root URL
        shell: bash
        env:
          DEPLOYED_URL: ${{ steps.deployment.outputs.page_url }}
          RELEASE_COMMIT: ${{ needs.build.outputs.release_commit }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ "${DEPLOYED_URL%/}/" != "https://openmathquest.github.io/" ]]; then
            echo "::error::The Pages deployment did not report the approved organization-root URL."
            exit 1
          fi
          if [[ -z "$RELEASE_COMMIT" ]] ||
             [[ ! "$RELEASE_COMMIT" =~ ^[a-f0-9]{40}$ ]] ||
             [[ "$RELEASE_TAG" != "v1.0.0-beta.1" ]]
          then
            echo "::error::The deployment is not bound to the verified Public Beta 1 tag and commit."
            exit 1
          fi
