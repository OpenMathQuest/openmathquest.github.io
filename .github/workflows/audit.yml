name: Math Quest checks

on:
  pull_request:
  push:
    branches:
      - main
      - codex/beta9-fuzz-diagnostic
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact frozen main-branch commit to certify
        required: true
        type: string
      release_tag:
        description: Public release tag, or audit-execution-qualification for the non-release execution benchmark
        required: true
        type: string
      execution_qualification:
        description: Run one non-release serial-versus-bounded execution qualification
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  development-checks:
    if: github.event_name != 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.0
          package-manager-cache: false

      - name: Install reviewed browser-test dependencies
        shell: powershell
        run: .\audit\install-reviewed-ci-dependencies.ps1

      - name: Install reviewed security scanners
        shell: powershell
        run: |
          .\audit\install-reviewed-security-tools.ps1 -CachePath (Join-Path $env:RUNNER_TEMP 'math-quest-security-tools')

      - name: Run complete ordered AI-change loop
        shell: powershell
        run: node .\audit\run-ai-change-loop.mjs --progress

      - name: Retain synthetic interaction-fuzz failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: math-quest-interaction-fuzz-failure-${{ github.sha }}
          path: |
            audit/.tmp-playwright-interaction-fuzz-report.json
            audit/.tmp-playwright-interaction-fuzz/edge-desktop.json
            audit/.tmp-playwright-interaction-fuzz/edge-phone.json
            audit/.tmp-playwright-interaction-fuzz/edge-desktop-original-failure.json
            audit/.tmp-playwright-interaction-fuzz/edge-phone-original-failure.json
            audit/.tmp-playwright-interaction-fuzz/edge-desktop-failure.png
            audit/.tmp-playwright-interaction-fuzz/edge-phone-failure.png
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90

  full-audit:
    if: github.event_name == 'workflow_dispatch' && inputs.execution_qualification != true
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      MQ_AUDIT_RUNNER_LABEL: windows-latest
    outputs:
      browser_product_name: ${{ steps.browser_evidence.outputs.product_name }}
      browser_full_version: ${{ steps.browser_evidence.outputs.full_version }}
      browser_executable_sha256: ${{ steps.browser_evidence.outputs.executable_sha256 }}
      runner_image_os: ${{ steps.browser_evidence.outputs.image_os }}
      runner_image_version: ${{ steps.browser_evidence.outputs.image_version }}
      audit_artifact_id: ${{ steps.upload_audit_evidence.outputs.artifact-id }}
      audit_artifact_digest: ${{ steps.upload_audit_evidence.outputs.artifact-digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          # The selected evidence-successor policy must inspect the named
          # qualification parent and its exact closed evidence-only diff. A
          # one-commit shallow checkout cannot prove that relationship.
          fetch-depth: 0

      - name: Verify immutable release-candidate boundary
        shell: powershell
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          if ($env:GITHUB_REPOSITORY -cne 'OpenMathQuest/openmathquest.github.io' -or
              $env:GITHUB_REF -cne 'refs/heads/main' -or
              $env:GITHUB_REF_TYPE -cne 'branch' -or
              $env:GITHUB_REF_NAME -cne 'main') {
            throw 'Release certification must be dispatched from protected main in the public Math Quest repository.'
          }
          if ($env:CANDIDATE_SHA -cnotmatch '^[a-f0-9]{40}$' -or
              $env:CANDIDATE_SHA -cne $env:GITHUB_SHA) {
            throw 'candidate_sha must exactly equal the frozen commit selected for this workflow run.'
          }
          $version = (Get-Content -LiteralPath 'VERSION' -Raw).Trim()
          if ($env:RELEASE_TAG_INPUT -cne "v$version") {
            throw "release_tag must exactly equal v$version for the frozen candidate."
          }

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.0
          package-manager-cache: false

      - name: Install reviewed browser-test dependencies
        shell: powershell
        run: .\audit\install-reviewed-ci-dependencies.ps1

      - name: Run deterministic engine and browser audit
        shell: powershell
        run: |
          if ($env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or
              [string]::IsNullOrWhiteSpace($env:ImageOS) -or
              [string]::IsNullOrWhiteSpace($env:ImageVersion)) {
            throw 'The audit requires exact ImageOS and ImageVersion metadata from a GitHub-hosted runner.'
          }
          $nodePath = (Get-Command node.exe -ErrorAction Stop).Source
          & .\audit\run-audit.ps1 -NodePath $nodePath

      - name: Export exact browser and runner evidence
        if: always()
        id: browser_evidence
        shell: powershell
        run: |
          if (-not (Test-Path -LiteralPath 'audit/last-report.json' -PathType Leaf)) {
            throw 'The machine-readable audit report was not produced.'
          }
          $report = Get-Content -LiteralPath 'audit/last-report.json' -Raw | ConvertFrom-Json
          $evidence = $report.browser.evidence
          if ($null -eq $evidence -or
              $evidence.status -cne 'OBSERVED_GITHUB_HOSTED' -or
              $evidence.validForPublication -ne $true -or
              $evidence.runnerKind -cne 'GITHUB_HOSTED' -or
              $evidence.requestedRunnerLabel -cne 'windows-latest' -or
              $evidence.runnerImageOS -cne $env:ImageOS -or
              $evidence.runnerImageVersion -cne $env:ImageVersion) {
            throw 'The report does not contain the exact current GitHub-hosted browser/runner evidence tuple.'
          }
          if ($evidence.browserProductName -cnotin @('Microsoft Edge', 'Google Chrome') -or
              $evidence.browserFullVersion -cnotmatch '^\d+\.\d+\.\d+\.\d+$' -or
              $evidence.browserExecutableSha256 -cnotmatch '^[a-f0-9]{64}$') {
            throw 'The browser evidence tuple is malformed.'
          }
          $clearanceStatus = (Get-Content -LiteralPath 'PUBLICATION_CLEARANCE.md' -TotalCount 2)[1]
          if ($clearanceStatus -ceq 'Status: APPROVED' -and $report.publication.status -cne 'APPROVED') {
            throw 'Approved publication clearance or its independently required hosted evidence is invalid.'
          }
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "product_name=$($evidence.browserProductName)`n", $utf8NoBom)
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "full_version=$($evidence.browserFullVersion)`n", $utf8NoBom)
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "executable_sha256=$($evidence.browserExecutableSha256)`n", $utf8NoBom)
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "image_os=$($evidence.runnerImageOS)`n", $utf8NoBom)
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "image_version=$($evidence.runnerImageVersion)`n", $utf8NoBom)
          $summaryLines = @(
            '### Exact browser and runner evidence'
            ''
            '> Candidate evidence only. This artifact does not approve publication.'
            ''
            "| Field | Value |"
            "|---|---|"
            "| Browser product | ``$($evidence.browserProductName)`` |"
            "| Full product version | ``$($evidence.browserFullVersion)`` |"
            "| Executable SHA-256 | ``$($evidence.browserExecutableSha256)`` |"
            "| Requested runner label | ``windows-latest`` |"
            "| ImageOS | ``$($evidence.runnerImageOS)`` |"
            "| ImageVersion | ``$($evidence.runnerImageVersion)`` |"
          )
          [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, (($summaryLines -join "`n") + "`n"), $utf8NoBom)

      - name: Upload machine-readable audit evidence
        if: always() && hashFiles('audit/last-report.json') != ''
        id: upload_audit_evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: math-quest-candidate-audit-evidence-${{ github.sha }}
          path: audit/last-report.json
          if-no-files-found: error
          retention-days: 90

  deep-ux-census:
    if: github.event_name == 'workflow_dispatch' && inputs.execution_qualification != true
    runs-on: windows-latest
    # Six viewports run in three two-worker waves; Beta 8 measured each wave at
    # roughly one hour, so retain the complete 4,242-cell plan with safe headroom.
    timeout-minutes: 240
    env:
      MQ_AUDIT_RUNNER_LABEL: windows-latest
    steps:
      - name: Check out exact frozen candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify candidate and alternating-beta census cadence
        id: cadence
        shell: powershell
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          if ($env:GITHUB_REPOSITORY -cne 'OpenMathQuest/openmathquest.github.io' -or
              $env:GITHUB_REF -cne 'refs/heads/main' -or
              $env:CANDIDATE_SHA -cnotmatch '^[a-f0-9]{40}$' -or
              $env:CANDIDATE_SHA -cne $env:GITHUB_SHA) {
            throw 'The Deep UX Census requires the exact frozen protected-main candidate.'
          }
          $version = (Get-Content -LiteralPath 'VERSION' -Raw).Trim()
          if ($env:RELEASE_TAG_INPUT -cne "v$version") {
            throw 'release_tag does not match VERSION.'
          }
          $required = $false
          if ($version -match '^\d+\.\d+\.\d+-beta\.(0|[1-9]\d*)$') {
            $ordinal = [int]$Matches[1]
            $required = $ordinal -ge 4 -and ($ordinal % 2) -eq 0
          }
          "required=$($required.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          if (-not $required) {
            'Deep UX Census: not required by the alternating-beta cadence. This is not a pass or substitute.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }

      - name: Set up Node.js 24
        if: steps.cadence.outputs.required == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.0
          package-manager-cache: false

      - name: Install reviewed browser-test dependencies
        if: steps.cadence.outputs.required == 'true'
        shell: powershell
        run: .\audit\install-reviewed-ci-dependencies.ps1

      - name: Run complete Playwright Deep UX Census
        if: steps.cadence.outputs.required == 'true'
        shell: powershell
        env:
          MQ_DEEP_UX_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          if ($env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or
              [string]::IsNullOrWhiteSpace($env:ImageOS) -or
              [string]::IsNullOrWhiteSpace($env:ImageVersion)) {
            throw 'The complete Deep UX Census requires a GitHub-hosted Windows runner.'
          }
          node .\audit\run-playwright-deep-ux-census.mjs --full

      - name: Upload compact census report and anomaly-only evidence
        if: always() && steps.cadence.outputs.required == 'true' && hashFiles('audit/.tmp-playwright-deep-ux-report.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: math-quest-deep-ux-census-${{ github.sha }}
          path: |
            audit/.tmp-playwright-deep-ux-report.json
            audit/.tmp-playwright-deep-ux-artifacts
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  audit-execution-qualification:
    if: github.event_name == 'workflow_dispatch' && inputs.execution_qualification == true
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      MQ_AUDIT_RUNNER_LABEL: windows-latest
    steps:
      - name: Check out exact qualification candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify non-release qualification boundary
        shell: powershell
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          if ($env:GITHUB_REPOSITORY -cne 'OpenMathQuest/openmathquest.github.io' -or
              $env:GITHUB_REF -cne 'refs/heads/main' -or
              $env:GITHUB_REF_TYPE -cne 'branch' -or
              $env:GITHUB_REF_NAME -cne 'main' -or
              $env:CANDIDATE_SHA -cnotmatch '^[a-f0-9]{40}$' -or
              $env:CANDIDATE_SHA -cne $env:GITHUB_SHA) {
            throw 'Execution qualification must use the exact protected-main candidate in the public Math Quest repository.'
          }
          if ($env:RELEASE_TAG_INPUT -cne 'audit-execution-qualification') {
            throw 'The non-release qualification requires the audit-execution-qualification sentinel and never creates a tag or release.'
          }
          $workspacePrefix = ([IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).TrimEnd([char[]]@('\', '/'))) + [IO.Path]::DirectorySeparatorChar
          $qualificationDirectory = [IO.Path]::GetFullPath((Join-Path $env:RUNNER_TEMP 'math-quest-audit-execution-qualification'))
          $qualificationPrefix = $qualificationDirectory.TrimEnd([char[]]@('\', '/')) + [IO.Path]::DirectorySeparatorChar
          if ($qualificationPrefix.StartsWith($workspacePrefix, [StringComparison]::OrdinalIgnoreCase)) {
            throw 'Execution qualification evidence must remain outside the audited repository checkout.'
          }
          [IO.Directory]::CreateDirectory($qualificationDirectory) | Out-Null
          "MQ_AUDIT_QUALIFICATION_DIRECTORY=$qualificationDirectory" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.0
          package-manager-cache: false

      - name: Install reviewed browser-test dependencies
        shell: powershell
        run: .\audit\install-reviewed-ci-dependencies.ps1

      - name: Run serial reference once
        shell: powershell
        env:
          MQ_AUDIT_EXECUTION_MODE: SERIAL_REFERENCE
        run: |
          $entryTimer = [Diagnostics.Stopwatch]::StartNew()
          $nodePath = (Get-Command node.exe -ErrorAction Stop).Source
          $nodeDigest = (Get-FileHash -LiteralPath $nodePath -Algorithm SHA256).Hash.ToLowerInvariant()
          & .\audit\run-audit.ps1 -NodePath $nodePath -TechnicalOnly
          $entryExit = $LASTEXITCODE
          $entryTimer.Stop()
          if ($entryExit -ne 0) { throw 'The serial technical entry point failed.' }
          if ((Get-FileHash -LiteralPath $nodePath -Algorithm SHA256).Hash.ToLowerInvariant() -cne $nodeDigest) { throw 'The Node executable changed during the technical entry point.' }
          Copy-Item -LiteralPath 'audit/last-report.json' -Destination (Join-Path $env:MQ_AUDIT_QUALIFICATION_DIRECTORY 'execution-qualification-serial.json')
          $reportPath = Join-Path $env:MQ_AUDIT_QUALIFICATION_DIRECTORY 'execution-qualification-serial.json'
          $timingPath = Join-Path $env:MQ_AUDIT_QUALIFICATION_DIRECTORY 'execution-qualification-serial-timing.json'
          $timing = [ordered]@{
            schemaVersion = 1; boundary = 'TECHNICAL_ENTRY_POINT'; executionStatus = 'COMPLETED'
            reportSha256 = (Get-FileHash -LiteralPath $reportPath -Algorithm SHA256).Hash.ToLowerInvariant()
            nodeExecutableSha256 = $nodeDigest
            wallDurationMs = $entryTimer.ElapsedMilliseconds
          }
          [IO.File]::WriteAllText($timingPath, ($timing | ConvertTo-Json), [Text.UTF8Encoding]::new($false))

      - name: Run bounded candidate once
        shell: powershell
        env:
          MQ_AUDIT_EXECUTION_MODE: BOUNDED_PARALLEL
        run: |
          $entryTimer = [Diagnostics.Stopwatch]::StartNew()
          $nodePath = (Get-Command node.exe -ErrorAction Stop).Source
          $nodeDigest = (Get-FileHash -LiteralPath $nodePath -Algorithm SHA256).Hash.ToLowerInvariant()
          & .\audit\run-audit.ps1 -NodePath $nodePath -TechnicalOnly
          $entryExit = $LASTEXITCODE
          $entryTimer.Stop()
          if ($entryExit -ne 0) { throw 'The bounded technical entry point failed.' }
          if ((Get-FileHash -LiteralPath $nodePath -Algorithm SHA256).Hash.ToLowerInvariant() -cne $nodeDigest) { throw 'The Node executable changed during the technical entry point.' }
          Copy-Item -LiteralPath 'audit/last-report.json' -Destination (Join-Path $env:MQ_AUDIT_QUALIFICATION_DIRECTORY 'execution-qualification-parallel.json')
          $reportPath = Join-Path $env:MQ_AUDIT_QUALIFICATION_DIRECTORY 'execution-qualification-parallel.json'
          $timingPath = Join-Path $env:MQ_AUDIT_QUALIFICATION_DIRECTORY 'execution-qualification-parallel-timing.json'
          $timing = [ordered]@{
            schemaVersion = 1; boundary = 'TECHNICAL_ENTRY_POINT'; executionStatus = 'COMPLETED'
            reportSha256 = (Get-FileHash -LiteralPath $reportPath -Algorithm SHA256).Hash.ToLowerInvariant()
            nodeExecutableSha256 = $nodeDigest
            wallDurationMs = $entryTimer.ElapsedMilliseconds
          }
          [IO.File]::WriteAllText($timingPath, ($timing | ConvertTo-Json), [Text.UTF8Encoding]::new($false))

      - name: Require equivalent evidence and measured improvement
        shell: powershell
        run: |
          $serialPath = Join-Path $env:MQ_AUDIT_QUALIFICATION_DIRECTORY 'execution-qualification-serial.json'
          $parallelPath = Join-Path $env:MQ_AUDIT_QUALIFICATION_DIRECTORY 'execution-qualification-parallel.json'
          $comparisonPath = Join-Path $env:MQ_AUDIT_QUALIFICATION_DIRECTORY 'execution-qualification-comparison.json'
          $serialTimingPath = Join-Path $env:MQ_AUDIT_QUALIFICATION_DIRECTORY 'execution-qualification-serial-timing.json'
          $parallelTimingPath = Join-Path $env:MQ_AUDIT_QUALIFICATION_DIRECTORY 'execution-qualification-parallel-timing.json'
          $comparison = & node .\audit\compare-audit-execution-modes.mjs "--serial=$serialPath" "--parallel=$parallelPath" "--serial-entry-timing=$serialTimingPath" "--parallel-entry-timing=$parallelTimingPath"
          $comparisonExit = $LASTEXITCODE
          $comparison | Set-Content -LiteralPath $comparisonPath -Encoding utf8
          if ($comparisonExit -ne 0) { throw 'Bounded audit execution did not qualify.' }

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: math-quest-audit-execution-qualification-${{ github.sha }}
          path: |
            ${{ runner.temp }}/math-quest-audit-execution-qualification/execution-qualification-serial.json
            ${{ runner.temp }}/math-quest-audit-execution-qualification/execution-qualification-parallel.json
            ${{ runner.temp }}/math-quest-audit-execution-qualification/execution-qualification-comparison.json
            ${{ runner.temp }}/math-quest-audit-execution-qualification/execution-qualification-serial-timing.json
            ${{ runner.temp }}/math-quest-audit-execution-qualification/execution-qualification-parallel-timing.json
          if-no-files-found: error
          retention-days: 90

  historical-fuzz-diagnostic:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/beta9-fuzz-diagnostic'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out diagnostic harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify diagnostic boundary
        shell: powershell
        run: |
          if ($env:GITHUB_REPOSITORY -cne 'OpenMathQuest/openmathquest.github.io' -or
              $env:GITHUB_REF -cne 'refs/heads/codex/beta9-fuzz-diagnostic' -or
              $env:GITHUB_EVENT_NAME -cne 'push' -or
              $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or
              [string]::IsNullOrWhiteSpace($env:ImageOS) -or
              [string]::IsNullOrWhiteSpace($env:ImageVersion)) {
            throw 'This bounded historical diagnostic requires its named branch and a GitHub-hosted Windows runner.'
          }
          Write-Output 'DIAGNOSTIC_ONLY: no release certification, publication clearance, or historical-failure resolution claim.'

      - name: Set up pinned Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.0
          package-manager-cache: false

      - name: Install existing reviewed dependencies
        shell: powershell
        run: .\audit\install-reviewed-ci-dependencies.ps1

      - name: Bind historical served runtime and current capture harness
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $historicalSha = '35059be92b0f0d95b470c671b6adcd47e542c5ef'
          $captureSha = '1a70e86d8b943eb73fff2e6b75eeaa7c3affdc90'
          $runtimePaths = @(node --input-type=module --eval "import { PLAYWRIGHT_FOCUSED_SERVER_ROUTES as routes } from './audit/lib/playwright-focused-contract.mjs'; console.log([...new Set(routes.map(([, relativePath]) => relativePath))].sort().join('\n'));" )
          if ($LASTEXITCODE -ne 0 -or $runtimePaths.Count -eq 0) { throw 'Canonical served-runtime discovery failed.' }
          $nodePath = (Get-Command node).Source
          $nodeHash = (Get-FileHash -LiteralPath $nodePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ((node --version) -cne 'v24.14.0' -or
              $nodeHash -cne '63c259c81e5d472b5f11c8d506070130cb04a1ecf84b80377a34ed6ec9048088') {
            throw 'The pinned diagnostic Node identity changed.'
          }
          git fetch origin $historicalSha
          if ($LASTEXITCODE -ne 0) { throw 'Exact historical checkout is unavailable.' }
          $capturePaths = @('Serve-MathQuest.ps1', 'playwright.interaction-fuzz.config.mjs',
            'audit/run-playwright-interaction-fuzz.mjs', 'audit/playwright/interaction-fuzz.spec.mjs',
            'audit/playwright/fixtures.mjs', 'audit/lib/playwright-interaction-fuzz.mjs',
            'audit/lib/playwright-focused-contract.mjs', 'package.json', 'package-lock.json')
          foreach ($capturePath in $capturePaths) {
            $difference = @(git diff --name-only $captureSha HEAD -- $capturePath)
            if ($LASTEXITCODE -ne 0 -or $difference.Count -ne 0) { throw "Capture harness changed: $capturePath" }
          }
          New-Item -ItemType Directory -Path audit-artifacts/historical-fuzz -Force | Out-Null
          $runtimeArchive = Join-Path $env:RUNNER_TEMP 'math-quest-historical-runtime.zip'
          git archive --format=zip "--output=$runtimeArchive" $historicalSha -- $runtimePaths
          if ($LASTEXITCODE -ne 0) { throw 'Historical runtime archive failed.' }
          Expand-Archive -LiteralPath $runtimeArchive -DestinationPath $env:GITHUB_WORKSPACE -Force
          $runtimeBindings = @()
          foreach ($runtimePath in $runtimePaths) {
            $historicalBlob = (git rev-parse "${historicalSha}:$runtimePath").Trim()
            $observedBlob = (git hash-object --no-filters -- $runtimePath).Trim()
            if ($LASTEXITCODE -ne 0 -or $historicalBlob -cne $observedBlob) { throw "Historical bytes differ: $runtimePath" }
            $runtimeBindings += [ordered]@{ path = $runtimePath; gitBlobOid = $observedBlob }
          }
          $record = [ordered]@{
            kind = 'BOUNDED_HOSTED_HISTORICAL_BROWSER_FUZZ_DIAGNOSTIC'; certificationClaim = 'NONE'
            historicalSha = $historicalSha; captureHarnessSha = $captureSha; diagnosticWorkflowSha = $env:GITHUB_SHA
            nodeVersion = '24.14.0'; nodeExecutableSha256 = $nodeHash
            runnerImageOS = $env:ImageOS; runnerImageVersion = $env:ImageVersion
            workflowRunId = $env:GITHUB_RUN_ID; workflowRunAttempt = $env:GITHUB_RUN_ATTEMPT
            maximumAttempts = 3; stopOnFirstFailure = $true; runtimeBindings = $runtimeBindings
          }
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          [IO.File]::WriteAllText((Join-Path $env:GITHUB_WORKSPACE 'audit-artifacts/historical-fuzz/construction.json'), (($record | ConvertTo-Json -Depth 8) + "`n"), $utf8)

      - name: Run bounded diagnostic and retain every attempt
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $construction = Get-Content -LiteralPath audit-artifacts/historical-fuzz/construction.json -Raw | ConvertFrom-Json
          $edgeCandidates = @('C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe',
            'C:\Program Files\Microsoft\Edge\Application\msedge.exe')
          $edge = $edgeCandidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $edge) { throw 'Reviewed installed Edge is unavailable.' }
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          foreach ($attempt in 1..$construction.maximumAttempts) {
            $attemptDir = Join-Path $env:GITHUB_WORKSPACE "audit-artifacts/historical-fuzz/attempt-$attempt"
            New-Item -ItemType Directory -Path $attemptDir | Out-Null
            $started = (Get-Date).ToUniversalTime().ToString('o')
            $browserHashBefore = (Get-FileHash -LiteralPath $edge -Algorithm SHA256).Hash.ToLowerInvariant()
            $browserVersion = (Get-Item -LiteralPath $edge).VersionInfo.ProductVersion
            $process = Start-Process -FilePath (Get-Command node).Source `
              -ArgumentList @('.\audit\run-playwright-interaction-fuzz.mjs') `
              -WorkingDirectory $env:GITHUB_WORKSPACE -WindowStyle Hidden -Wait -PassThru `
              -RedirectStandardOutput (Join-Path $attemptDir 'execution.stdout.log') `
              -RedirectStandardError (Join-Path $attemptDir 'execution.stderr.log')
            $exitCode = $process.ExitCode
            $browserHashAfter = (Get-FileHash -LiteralPath $edge -Algorithm SHA256).Hash.ToLowerInvariant()
            $summary = $null
            if (Test-Path -LiteralPath audit/.tmp-playwright-interaction-fuzz-report.json) {
              Copy-Item -LiteralPath audit/.tmp-playwright-interaction-fuzz-report.json -Destination (Join-Path $attemptDir 'report.json')
              $summary = (Get-Content -LiteralPath audit/.tmp-playwright-interaction-fuzz-report.json -Raw | ConvertFrom-Json).summary
            }
            if (Test-Path -LiteralPath audit/.tmp-playwright-interaction-fuzz) {
              Copy-Item -LiteralPath audit/.tmp-playwright-interaction-fuzz -Destination (Join-Path $attemptDir 'retained-artifacts') -Recurse
            }
            $runtimeUnchanged = $true
            foreach ($binding in $construction.runtimeBindings) {
              $observedBlob = (git hash-object --no-filters -- $binding.path).Trim()
              if ($LASTEXITCODE -ne 0 -or $observedBlob -cne $binding.gitBlobOid) { $runtimeUnchanged = $false }
            }
            $result = [ordered]@{
              attempt = $attempt; executionExitCode = $exitCode; certificationClaim = 'NONE'
              startedAtUtc = $started; endedAtUtc = (Get-Date).ToUniversalTime().ToString('o')
              browserProductName = 'Microsoft Edge'; browserFullVersion = $browserVersion
              browserExecutableSha256Before = $browserHashBefore; browserExecutableSha256After = $browserHashAfter
              runtimeUnchanged = $runtimeUnchanged; summary = $summary
            }
            [IO.File]::WriteAllText((Join-Path $attemptDir 'execution-metadata.json'), (($result | ConvertTo-Json -Depth 8) + "`n"), $utf8)
            Write-Output "Historical diagnostic attempt $attempt exited $exitCode."
            if ($exitCode -ne 0 -or -not $runtimeUnchanged -or $browserHashBefore -cne $browserHashAfter) {
              throw 'Diagnostic stopped at its first non-pass or changed identity; retain the original evidence.'
            }
          }

      - name: Upload bounded synthetic diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: math-quest-historical-fuzz-${{ github.run_id }}
          path: |
            audit-artifacts/historical-fuzz/
            audit/.tmp-playwright-interaction-fuzz-report.json
            audit/.tmp-playwright-interaction-fuzz/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
